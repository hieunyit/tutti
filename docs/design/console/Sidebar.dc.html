<helmet>

<style>
body{margin:0}

<nav aria-label="Main" style="width: 248px; min-height: 900px; height: 100%; box-sizing: border-box; background: #0B1220; color: #CBD5E1; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; padding: 16px 12px; gap: 4px">
  <div style="display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px">
    <div aria-hidden="true" style="width: 32px; height: 32px; border-radius: 8px; background: #3B6CF6; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px">T</div>

      <span style="color: #F8FAFC; font-weight: 600; font-size: 15px">Tutti</span>
      <span style="color: #94A3B8; font-size: 12px">S3 replication console</span>
    </div>
  </div>
  <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
    <div style="display: flex; flex-direction: column; gap: 2px; padding-top: 12px">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #94A3B8; padding: 0 10px 6px">{{g.label}}</span>
      <sc-for list="{{g.items}}" as="it" hint-placeholder-count="2">
        <a href="{{it.href}}" style="{{it.style}}">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{it.icon}}"></path></svg>
          <span>{{it.label}}</span>
          <sc-if value="{{it.badge}}" hint-placeholder-val="{{false}}"><span style="margin-left: auto; background: #7A271A; color: #FEE4E2; font-size: 11px; font-weight: 600; border-radius: 999px; padding: 1px 7px">{{it.badge}}</span></sc-if>
        </a>
      </sc-for>
    </div>
  </sc-for>
  <div style="margin-top: auto; border-top: 1px solid #1E293B; padding: 12px 10px 0; display: flex; flex-direction: column; gap: 8px; font-size: 12px; color: #94A3B8">
    <a href="Docs.dc.html" style="color: #CBD5E1; text-decoration: none; display: flex; gap: 10px; align-items: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"></circle><path d="M12 8h.01M11 12h1v5h1"></path></svg>About Tutti</a>
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span>v0.1.0 · build 7c5b36c</span>
      <button type="button" aria-label="Collapse sidebar" style="background: transparent; border: 1px solid #1E293B; color: #CBD5E1; border-radius: 6px; width: 28px; height: 28px; cursor: pointer">&#8249;</button>
    </div>
  </div>
</nav>
</x-dc>
