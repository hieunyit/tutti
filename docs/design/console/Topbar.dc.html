<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tutti top bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<header style="height: 56px; box-sizing: border-box; background: #FFFFFF; border-bottom: 1px solid #E4E7EC; display: flex; align-items: center; gap: 16px; padding: 0 24px; flex-wrap: wrap; font-family: Inter, system-ui, sans-serif; color: #101828">
  <nav aria-label="Breadcrumb" style="font-size: 13px; color: #667085; display: flex; gap: 8px"><span>{{section}}</span><span aria-hidden="true">/</span><span style="color: #101828; font-weight: 600">{{page}}</span></nav>
  <label style="margin-left: auto; display: flex; align-items: center; gap: 8px; border: 1px solid #D0D5DD; border-radius: 8px; padding: 0 10px; height: 36px; width: 300px; max-width: 100%; color: #667085; font-size: 13px">
    <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
    <input type="search" placeholder="Search buckets, users, keys" aria-label="Search" style="border: 0; outline: 0; font: inherit; width: 100%; background: transparent">
  </label>
  <span style="font-size: 12px; font-weight: 600; color: #B54708; background: #FFFAEB; border: 1px solid #FEDF89; border-radius: 999px; padding: 2px 10px">production</span>
  <button type="button" style="display: flex; align-items: center; gap: 8px; border: 1px solid #D0D5DD; background: #FFFFFF; border-radius: 8px; height: 36px; padding: 0 10px; font: inherit; font-size: 13px; cursor: pointer">
    <span aria-hidden="true" style="width: 24px; height: 24px; border-radius: 999px; background: #E0E8FF; color: #2952CC; font-weight: 700; font-size: 12px; display: flex; align-items: center; justify-content: center">A</span>
    <span style="font-weight: 600">admin</span><span style="color: #667085">Administrator</span>
  </button>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"section":{"editor":"text","default":"Storage"},"page":{"editor":"text","default":"Storages"},"$preview":{"width":1192,"height":56}}'>
class Component extends DCLogic {
  renderVals() {
    return { section: this.props.section ?? 'Storage', page: this.props.page ?? 'Storages' };
  }
}
</script>
</body>
</html>
