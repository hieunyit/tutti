# Redis topology: see docs/tutti/configuration.md. Sentinel example (also for the worker):
# redis:
#   addresses: [sentinel-1:26379, sentinel-2:26379, sentinel-3:26379]
#   sentinel: {masterName: tutti, password: "<sentinel-password>"}
#   password: "<redis-password>"
#   # optional: config, queue, lock, meta on separate instances, each may use DB 0
#   queue: {addresses: ["queue-redis:6379"], db: 0}
#   config: {addresses: ["cfg-redis:6379"], db: 0}
