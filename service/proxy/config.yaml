address: "http://localhost:9669" # Chorus proxy s3 api address
port: 9669
replication:
  # What to do when a write succeeded on the main storage but its replication event could not be recorded
  # (e.g. Redis is out of memory, read-only after failover):
  #   fail - (default) respond 503 ServiceUnavailable so the client retries the idempotent request, which records the event again.
  #   log  - legacy behavior: respond with the storage response and only log the error. Follower may silently diverge.
  onEventError: fail
  eventRetryBudget: 2s # total time to retry recording the event (exponential backoff) before onEventError applies
  # Synchronous replication on the write path. When enabled, after the main write succeeded and the event was
  # recorded, the proxy copies the object to the replication destinations BEFORE answering the client.
  # The replication task stays enqueued as a safety net: destinations that fail or time out are completed by the worker.
  # Applies to object writes/deletes (PutObject, CompleteMultipartUpload, CopyObject, DeleteObject(s)); ACL/tag/bucket tasks stay async.
  # The response carries header X-Tutti-Replicas: <copies>/<1+destinations>.
  sync:
    enabled: false
    writeQuorum: 0 # copies (main included) that must exist before answering; 0 = main + all destinations
    timeout: 30s # max time spent syncing destinations per request
    # What to do when fewer than writeQuorum copies exist:
    #   fail   - respond 503 ServiceUnavailable (data is on main and the task is enqueued; the client may retry)
    #   accept - forward main's response (header still reports the copies count)
    onQuorumFailure: fail
# Per-storage circuit breakers, fed by periodic health probes (storages.<name>.healthCheckInterval, default 10s)
# and by the outcome of real requests. While a breaker is open, requests to that storage fail immediately with
# 503 ServiceUnavailable instead of waiting for httpTimeout, and synchronous replication skips that destination.
# Network errors, timeouts and 5xx count as failures; any definitive S3 answer (2xx/3xx/4xx) counts as success.
health:
  failureThreshold: 3 # consecutive failures that open the breaker
  openDuration: 30s # how long it stays open before one trial request/probe is allowed
cors:
  enabled: false
  allowAll: false
  whitelist:
auth:
  allowV2Signature: false
  useStorage: # use credentials from one of configured storages <one|two>
  custom: # OR use custom credentials for proxy s3 endpoint
#    user1:
#      accessKeyID: <user1 v4 accessKey credential>
#      secretAccessKey: <user1 v4 secretKey credential>
#    user2:
#      accessKeyID: <user2 v4 accessKey credential>
#      secretAccessKey: <user2 v4 secretKey credential>
storage:
  defaultRegion: "us-east-1" # fallback region. Will be used if origin region is not supported by replication destination
  dynamicCredentials:
    enabled: false # set true to enable to manage storage credentials via API
    disableEncryption: false
    masterPassword: "" # master password to encrypt/decrypt storage credentials.
    pollInterval: 3s # poll interval to check for updated credentials by chorus replicas
