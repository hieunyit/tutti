address: "http://localhost:9669" # Chorus proxy s3 api address
port: 9669
group: default # logical proxy group for centralized fleet config overrides (tutti:proxy-config)
replication:
  # What to do when a write succeeded on the main storage but its replication event could not be recorded
  # (e.g. Redis is out of memory, read-only after failover):
  #   fail - (default) respond 503 ServiceUnavailable so the client retries the idempotent request, which records the event again.
  #   log  - legacy behavior: respond with the storage response and only log the error. Follower may silently diverge.
  onEventError: fail
  eventRetryBudget: 2s # total time to retry recording the event (exponential backoff) before onEventError applies
  # Synchronous replication on the write path. When enabled, after the main write succeeded and the event was
  # recorded, the proxy starts copying the object to the replication destinations and answers when quorum is met.
  # The replication task stays enqueued as a safety net: failed, timed out, or pending destinations are completed by the worker.
  # Applies to object writes/deletes (PutObject, CompleteMultipartUpload, CopyObject, DeleteObject(s)); ACL/tag/bucket tasks stay async.
  # The response carries header X-Tutti-Replicas: <copies>/<1+destinations>.
  sync:
    enabled: false
    writeQuorum: 0 # copies (main included) that must exist before answering; 0 = main + all destinations
    timeout: 30s # max time spent syncing destinations per request
    # What to do when fewer than writeQuorum copies exist:
    #   fail   - respond 503 ServiceUnavailable (data is on main and the task is enqueued; the client may retry)
    #   accept - forward main's response (header still reports the copies count)
    onQuorumFailure: fail
# Per-storage circuit breakers, fed by periodic health probes (storages.<name>.healthCheckInterval, default 10s)
# and by the outcome of real requests. While a breaker is open, requests to that storage fail immediately with
# 503 ServiceUnavailable instead of waiting for httpTimeout, and synchronous replication skips that destination.
# Network errors, timeouts and 5xx count as failures; any definitive S3 answer (2xx/3xx/4xx) counts as success.
health:
  failureThreshold: 3 # consecutive failures that open the breaker
  openDuration: 30s # how long it stays open before one trial request/probe is allowed
# Optional automatic failover. Disabled by default: this is only the global safety switch and timing.
# WHAT may fail over to WHERE is decided by per-source-storage failover policies stored in Redis
# ({source, enabled, targets: [ordered], after, maxEventLag}); a storage without an enabled policy never fails over.
# When a source storage has its breaker continuously open for the policy `after`, the proxy re-routes its
# users/buckets to the first policy target that has a healthy replication from the source (init done, not
# paused/archived, no switch, same bucket name, lag <= maxEventLag) and pauses that replication.
# Only one proxy acts (Redis lock). Failback is never automatic, see docs. Events: Redis keys `tutti:failover:*`.
failover:
  enabled: false
  checkInterval: 10s
  # defaults used when a policy omits `after` / `maxEventLag`:
  after: 60s
  maxEventLag: 0
# Live status published to Redis (tutti:proxy-status:<app_id>, TTL 3x interval): storage health, settings,
# cumulative stats and current rates. One Redis SET per interval per proxy. Must be greater than 0.
status:
  interval: 2s
# GET /ready (no auth, not counted in traffic stats) for the load balancer. Returns 200 only when the config snapshot is
# loaded, Redis is reachable (or the snapshot is younger than maxStaleness, read-only mode) and storages are known.
ready:
  maxStaleness: 30s
# On SIGTERM the proxy reports not-ready, waits drainDelay so the load balancer stops sending traffic, then stops listening.
drainDelay: 5s
# In-memory snapshot of routing / switches / replication policies / generations (instead of ~8 Redis commands per request).
# Changes are announced by writers (Redis key tutti:cfg:version + pub/sub); writes validate the version per request.
snapshot:
  disabled: false
  pollInterval: 1s
  fullReload: 30s
# Protection group write fence. Each proxy holds a writer lease (Redis key tutti:protection:lease:proxy:<app_id>, refreshed
# every writerLease/6). A frozen group waits for the in-flight writes of a crashed proxy at most writerLease (plus the status
# report expiry) before its promotion proceeds; a proxy that cannot refresh its lease for writerLease/2 cancels its writes.
protectionGroups:
  writerLease: 30s
cors:
  enabled: false
  allowAll: false
  whitelist:
auth:
  allowV2Signature: false
  useStorage: # use credentials from one of configured storages <one|two>
  custom: # OR use custom credentials for proxy s3 endpoint
#    user1:
#      accessKeyID: <user1 v4 accessKey credential>
#      secretAccessKey: <user1 v4 secretKey credential>
#    user2:
#      accessKeyID: <user2 v4 accessKey credential>
#      secretAccessKey: <user2 v4 secretKey credential>
storage:
  defaultRegion: "us-east-1" # fallback region. Will be used if origin region is not supported by replication destination
  dynamicCredentials:
    enabled: false # set true to enable to manage storage credentials via API
    disableEncryption: false
    masterPassword: "" # master password to encrypt/decrypt storage credentials.
    pollInterval: 3s # poll interval to check for updated credentials by chorus replicas
  storages:
#    one: # yaml key with some handy storage name
#      address: <s3.chorus.com>
#      credentials:
#        user1:
#          accessKeyID: <user1 v4 accessKey credential>
#          secretAccessKey: <user1 v4 secretKey credential>
#        user2:
