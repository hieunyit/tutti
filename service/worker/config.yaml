# Runtime settings (concurrency, intervals, lock overlap, webhooks, and replication features)
# are managed dynamically in the PostgreSQL database and Redis projection.
# The values below serve as initial bootstrap defaults on fresh deployments.
# They can be changed via the Console Web UI (Administration -> System Settings) or the REST API:
# GET/PUT /tutti/system-settings. Concurrency, intervals, shutdownTimeout and lock overlap are read
# at process startup only and require a worker restart to take effect; feature flags and webhook
# settings may apply without a restart.
concurrency: 10 # max number of task that can be processed in parallel
shutdownTimeout: 5s
# Tuning knobs below are fallbacks: a non-zero System setting (worker.bulkConcurrencyPercent, multipartThreads,
# multipartPartSizeMib) wins over these values. Multipart settings apply to the next copy without restart.
bulkConcurrencyPercent: 20 # 5..95, share of concurrency for bulk migration; the rest serves live events (restart)
multipartThreads: 1 # 1..16, optional; keep 1 unless measured: parallel parts were slower in local tests, gain unverified
multipartPartSizeMiB: 16 # 5..512
worker:
  queueUpdateInterval: 3s
  swiftRetryInterval: 1m # used for swift task retries caused by swift inconsistent state
  pauseRetryInterval: 30s
  switchRetryInterval: 30s
  taskCheckInterval: 1s
  delayedTaskCheckInterval: 3s
lock:
  overlap: 2s
api:
  enabled: false # set true to enable management api
  grpcPort: 9670
  httpPort: 9671
  secure: false
  auth:
    enabled: false # set true to require login (Bearer session token) for the management api. Disabled by default for upgrade compatibility
    sessionIdleTimeout: 0s  # 0 = default 30m; end session after this long without a refresh. Key must exist for CFG_API_AUTH_SESSIONIDLETIMEOUT
    sessionMaxLifetime: 0s  # 0 = default 24h absolute cap from login; legacy sessionTTL is used when unset. CFG_API_AUTH_SESSIONMAXLIFETIME
    # users: bcrypt hashes; generate with: htpasswd -nbBC 10 "" 'password' | tr -d ':\n'
    # role admin: all operations; viewer: read-only operations
    # trustedProxies: CIDRs/IPs of reverse proxies (e.g. the nginx serving the web UI) whose
    # X-Forwarded-For / X-Real-IP are trusted to find the real client address. Without it every
    # user behind nginx shares one address. Headers from any other peer are ignored.
    # Failed logins are limited per (username, client IP): 10 per 15 min. A second, global
    # per-username limit of 100 per 15 min (any IP) only slows brute force down: when hit, that
    # username gets 429 for everyone until the window expires. Trade-off: protects against
    # distributed guessing, but a determined attacker can then still temporarily block that user.
    # Console accounts & passwords are fully managed and stored in PostgreSQL (console_users table).
    allowManagedUsers: true
    trustedProxies: []
    users: []
    #  - username: admin
    #    passwordHash: "$2y$10$..."
    #    role: admin
  webhook:
    enabled: false # enable chorus webhook for event sources like S3 bucket notification or swift access logs
    grpcPort: 0 # host grpc webhook on a separate port. By default will be hosted with management API
    httpPort: 0 # host http webhook on a separate port. By default will be hosted with management API
    baseUrl: "" # externally reachable base URL for webhook endpoints, used for S3 notification push endpoint
storage:
  # main: my_s3_storage # one of the storages in should be main
  dynamicCredentials:
    enabled: false # set true to enable to manage storage credentials via API
    disableEncryption: false
    masterPassword: "" # master password to encrypt/decrypt storage credentials.
    pollInterval: 3s # poll interval to check for updated credentials by chorus replicas
  storages:
  #   # example credentials for S3 compatible storage
  #   my_s3_storage: # uniq storage alias to refer in chorus API. Can be any lowercase string
  #     type: S3 # [REQUIRED] storage type: S3 or SWIFT
  #     rateLimit:
  #       enabled: false
  #       rpm: 60
  #     credentials:
  #       user1:
  #         accessKeyID: <user1 v4 accessKey credential>
  #         secretAccessKey: <user1 v4 secretKey credential>
  #       user2:
  #         accessKeyID: <user2 v4 accessKey credential>
  #         secretAccessKey: <user2 v4 secretKey credential>
  #     provider: <Ceph|Minio|Other> # S3 provider name. Required to use provider-specific APIs, like keeping original versionID. Use 'Other' if your storage is S3 compatible but not listed.
  #     isSecure: true #set false for http address
  #     address: clyso.com
  #     defaultRegion: ""
  #     healthCheckInterval: 5s
  #     httpTimeout: 10m0s
  #     # example credentials for OpenStack Swift storage
  #   my_swift_storage: # uniq storage alias to refer in chorus API. Can be any lowercase string
  #     type: SWIFT # [REQUIRED] storage type: S3 or SWIFT
  #     rateLimit:
  #       enabled: false
  #       rpm: 60
  #     credentials:
  #       b6ebf758c9894224a105e5531eaa4ce9: # have to be openstack project ID (aka tenant ID, aka swift account)
  #         username: username1 # Equal to openstack OS_USERNAME
  #         password: password1 # Equal to openstack OS_PASSWORD
  #         domainName: domain1 # Equal to openstack OS_DOMAIN_NAME
  #         tenantName: tenant1 # Equal to openstack OS_TENANT_NAME
  #       38ylf758c9894224a105e5531edl834h:
  #         username: username2
  #         password: password2
  #         domainName: domain2
  #         tenantName: tenant2
  #     storageEndpointName: endpoint # endpoint name in keystone catalog
  #     storageEndpointType: object-store # endpoint type in keystone catalog
  #     region: "" # openstack region name
  #     authURL: http://auth.url/v3 # keystone auth url
  #

# Redis topology: see docs/tutti/configuration.md. Sentinel example (must match the proxy):
# redis:
#   addresses: [sentinel-1:26379, sentinel-2:26379, sentinel-3:26379]
#   sentinel: {masterName: tutti, password: "<sentinel-password>"}
#   password: "<redis-password>"
#   # optional: config, queue, lock, meta on separate instances, each may use DB 0
#   queue: {addresses: ["queue-redis:6379"], db: 0}
#   config: {addresses: ["cfg-redis:6379"], db: 0}

# Control-plane database: see docs/tutti/control-plane-db.md.
# controlPlane:
#   backend: redis            # redis (default) | postgres
#   readOnly: false           # postgres only: reject all mutations with 503 Unavailable
#   postgres:
#     dsn: "postgres://tutti:secret@db:5432/tutti?sslmode=verify-full"
#     maxConns: 10
#     minConns: 0
#     connMaxLifetime: 30m
#     connMaxIdleTime: 5m
#     connectTimeout: 5s
#     statementTimeout: 10s
#     autoMigrate: false      # true in dev/docker-compose; in prod run `tutti-migrate-pg schema`
#   outbox:
#     pollInterval: 500ms
#     batchSize: 200
#     retryBackoff: 1s
#     maxBackoff: 1m
#     retention: 24h
