{{- /* Storage credentials secret */}}
{{- if include "tutti.createCredentialsSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tutti.credentialsSecretName" . }}
  labels:
    {{- include "tutti.labels" . | nindent 4 }}
  {{- with (include "tutti.annotations" (list dict .)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  config.yaml: |
    {{- if .Values.credentials.storages }}
    storage:
      storages:
        {{- range $storageName, $users := .Values.credentials.storages }}
        {{ $storageName }}:
          credentials:
            {{- $users | toYaml | nindent 12 }}
        {{- end }}
    {{- end }}
{{- end }}
---
{{- /* Dynamic credentials master password secret */}}
{{- if include "tutti.createDynamicCredentialsSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tutti.dynamicCredentialsSecretName" . }}
  labels:
    {{- include "tutti.labels" . | nindent 4 }}
  {{- with (include "tutti.annotations" (list dict .)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{ include "tutti.dynamicCredentialsSecretKey" . }}: {{ .Values.dynamicCredentials.masterPassword | quote }}
{{- end }}
