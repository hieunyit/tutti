{{- if .Values.proxy.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tutti.fullname" . }}-proxy
  labels:
    {{- include "tutti.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
  {{- with (include "tutti.annotations" (list dict .)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
data:
  config.yaml: |
    {{- /* Proxy-specific config */}}
    {{- .Values.proxy.config | toYaml | nindent 4 }}

    {{- /* Features */}}
    features:
      {{- .Values.features | toYaml | nindent 6 }}

    {{- /* Storage config (proxy version - uses storageURL for Swift) */}}
    {{- include "tutti.proxyStorageConfig" . | nindent 4 }}
{{- end }}
