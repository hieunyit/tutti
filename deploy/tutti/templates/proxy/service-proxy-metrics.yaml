{{- if and .Values.proxy.enabled .Values.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tutti.fullname" . }}-proxy-metrics
  labels:
    {{- include "tutti.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
    tutti.hieunyit.github.io/metrics: "true"
  {{- with (include "tutti.annotations" (list dict .)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "tutti.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
  ports:
    - name: metrics
      port: {{ include "tutti.metricsPort" . }}
      targetPort: metrics
{{- end }}
