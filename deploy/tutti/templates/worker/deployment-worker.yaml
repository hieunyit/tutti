apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tutti.fullname" . }}-worker
  labels:
    {{- include "tutti.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
  {{- with (include "tutti.annotations" (list dict .)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.worker.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "tutti.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "tutti.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
        {{- with (include "tutti.podLabels" (list .Values.worker.podLabels .)) }}
        {{- . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/worker/config.yaml") . | sha256sum }}
        {{- if include "tutti.createCredentialsSecret" . }}
        checksum/secret: {{ include (print $.Template.BasePath "/secrets/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.metrics.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: {{ include "tutti.metricsPort" . | quote }}
        {{- end }}
        {{- with (include "tutti.annotations" (list .Values.worker.podAnnotations .)) }}
        {{- . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "tutti.serviceAccountName" . }}
      {{- with .Values.worker.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 10
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          {{- with .Values.worker.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: CFG_REDIS_ADDRESS
              value: {{ include "tutti.redisAddresses" . | quote }}
            - name: CFG_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "tutti.redisSecretName" . }}
                  key: {{ include "tutti.redisSecretKey" . }}
            {{- if and (not .Values.redis.enabled) .Values.externalRedis.sentinel.masterName }}
            - name: CFG_REDIS_SENTINEL_MASTERNAME
              value: {{ .Values.externalRedis.sentinel.masterName | quote }}
            {{- end }}
            {{- with .Values.auth }}
            {{- with .bootstrapAdmin }}
            {{- if .existingSecret.name }}
            - name: TUTTI_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret.name | quote }}
                  key: {{ .existingSecret.key | default "password" | quote }}
            {{- end }}
            {{- if eq (toString .forceChange) "false" }}
            - name: TUTTI_BOOTSTRAP_ADMIN_FORCE_CHANGE
              value: "false"
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - name: CFG_METRICS_ENABLED
              value: "true"
            - name: CFG_METRICS_PORT
              value: {{ include "tutti.metricsPort" . | quote }}
            {{- end }}
            {{- if .Values.dynamicCredentials.enabled }}
            - name: CFG_STORAGE_DYNAMICCREDENTIALS_MASTERPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "tutti.dynamicCredentialsSecretName" . }}
                  key: {{ include "tutti.dynamicCredentialsSecretKey" . }}
            {{- end }}
            {{- if and .Values.worker.config.api.webhook.enabled (not .Values.worker.config.api.webhook.baseUrl) }}
            - name: CFG_API_WEBHOOK_BASEURL
              {{- if gt (int (.Values.worker.config.api.webhook.httpPort | default 0)) 0 }}
              value: {{ printf "http://%s-webhook.%s.svc.cluster.local:%d" (include "tutti.fullname" .) .Release.Namespace (int .Values.worker.config.api.webhook.httpPort) | quote }}
              {{- else }}
              value: {{ printf "http://%s-rest.%s.svc.cluster.local:%d" (include "tutti.fullname" .) .Release.Namespace (int .Values.worker.restService.port) | quote }}
              {{- end }}
            {{- end }}
          ports:
            {{- if .Values.worker.config.api.enabled }}
            - name: grpc
              containerPort: {{ .Values.worker.config.api.grpcPort | default 9670 }}
              protocol: TCP
            - name: rest
              containerPort: {{ .Values.worker.config.api.httpPort | default 9671 }}
              protocol: TCP
            {{- if and .Values.worker.config.api.webhook.enabled (gt (int (.Values.worker.config.api.webhook.grpcPort | default 0)) 0) }}
            - name: webhook-grpc
              containerPort: {{ .Values.worker.config.api.webhook.grpcPort }}
              protocol: TCP
            - name: webhook-http
              containerPort: {{ .Values.worker.config.api.webhook.httpPort }}
              protocol: TCP
            {{- end }}
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ include "tutti.metricsPort" . }}
              protocol: TCP
            {{- end }}
          {{- with .Values.worker.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /bin/config/config.yaml
              subPath: config.yaml
            {{- if or .Values.existingCredentialsSecret (include "tutti.createCredentialsSecret" .) }}
            - name: credentials
              mountPath: /bin/config/override.yaml
              subPath: config.yaml
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "tutti.fullname" . }}-worker
        {{- if or .Values.existingCredentialsSecret (include "tutti.createCredentialsSecret" .) }}
        - name: credentials
          secret:
            secretName: {{ include "tutti.credentialsSecretName" . }}
        {{- end }}
      {{- $nodeSelector := include "tutti.nodeSelector" (list .Values.worker.nodeSelector .Values.global.nodeSelector) }}
      {{- if $nodeSelector }}
      nodeSelector:
        {{- $nodeSelector | nindent 8 }}
      {{- end }}
      {{- $tolerations := include "tutti.tolerations" (list .Values.worker.tolerations .Values.global.tolerations) }}
      {{- if $tolerations }}
      tolerations:
        {{- $tolerations | nindent 8 }}
      {{- end }}
      {{- $affinity := include "tutti.affinity" (list .Values.worker.affinity .Values.global.affinity) }}
      {{- if $affinity }}
      affinity:
        {{- $affinity | nindent 8 }}
      {{- end }}
