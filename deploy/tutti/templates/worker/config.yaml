apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tutti.fullname" . }}-worker
  labels:
    {{- include "tutti.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
  {{- with (include "tutti.annotations" (list dict .)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
data:
  config.yaml: |
    {{- /* Worker-specific config */}}
    {{- .Values.worker.config | toYaml | nindent 4 }}

    {{- /* Features */}}
    features:
      {{- .Values.features | toYaml | nindent 6 }}

    {{- /* Storage config (worker version - includes authURL for Swift) */}}
    {{- include "tutti.workerStorageConfig" . | nindent 4 }}
