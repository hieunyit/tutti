{{- if .Values.worker.config.api.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tutti.fullname" . }}-rest
  labels:
    {{- include "tutti.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
  {{- with (include "tutti.annotations" (list .Values.worker.restService.annotations .)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.worker.restService.type }}
  ports:
    - name: rest
      port: {{ .Values.worker.restService.port }}
      targetPort: rest
      protocol: TCP
  selector:
    {{- include "tutti.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: worker
{{- end }}
