# Prometheus alerting rules for Tutti (proxy and worker).
#
# Every expression uses a metric that the code registers (pkg/metrics, pkg/policy/snapshot.go). Metrics are only
# exported when metrics.enabled is true in the proxy/worker configuration. Rules that need a metric which does not
# exist yet are kept at the bottom as commented-out TODO rules.
#
# Runbook links are relative to the repository root (docs/tutti/runbooks.md). Replace the prefix if your
# documentation is hosted elsewhere. See README.md in this directory for loading and tuning.
groups:
  - name: tutti-storage
    rules:
      - alert: TuttiStorageBreakerOpen
        expr: min by (storage) (storage_available) == 0
        for: 2m
        labels:
          severity: critical
          component: proxy
        annotations:
          summary: 'Storage {{ $labels.storage }} circuit breaker is open'
          description: 'storage_available{storage="{{ $labels.storage }}"} is 0 on at least one proxy, so requests to this storage fail fast. The breaker opens after about 3 failed probes or requests (about 30s with defaults). The 2m wait avoids alerts for short blips. Check per-proxy state with chorctl proxies.'
          runbook_url: 'docs/tutti/runbooks.md#a-a-storage-is-down-and-automatic-failover-happened'

      - alert: TuttiStorageBreakerFlapping
        expr: sum by (storage) (increase(storage_breaker_transitions_total{to="open"}[30m])) >= 3
        for: 5m
        labels:
          severity: warning
          component: proxy
        annotations:
          summary: 'Storage {{ $labels.storage }} circuit breaker opened {{ $value | humanize }} times in 30m'
          description: 'The storage keeps going up and down. Check network path, storage health and the health check interval before failover policies trigger on a transient outage.'
          runbook_url: 'docs/tutti/runbooks.md#a-a-storage-is-down-and-automatic-failover-happened'

  - name: tutti-failover
    rules:
      - alert: TuttiAutomaticFailover
        expr: sum by (from, to) (increase(failover_total[10m])) > 0
        for: 1m
        labels:
          severity: warning
          component: proxy
        annotations:
          summary: 'Automatic failover from {{ $labels.from }} to {{ $labels.to }}'
          description: 'Routing for at least one user or bucket moved to {{ $labels.to }}. Replication from {{ $labels.from }} is paused. Failback is manual: check the failover event (chorctl failover events) and the eventLag, then follow the failback procedure. Acknowledge the event only after failback.'
          runbook_url: 'docs/tutti/runbooks.md#a-a-storage-is-down-and-automatic-failover-happened'


  - name: tutti-proxy-policy-snapshot
    rules:
      - alert: TuttiPolicySnapshotStale
        expr: max by (instance) (policy_snapshot_age_seconds) > 30
        for: 2m
        labels:
          severity: warning
          component: proxy
        annotations:
          summary: 'Proxy {{ $labels.instance }} has not validated its policy snapshot for {{ $value | humanize }}s'
          description: 'policy_snapshot_age_seconds is the time since the last successful read of the config version from Redis. The proxy serves reads from its last known data. Writes are rejected with 503 if Redis stays unreachable. Compare with the Redis alert and the proxy logs.'
          runbook_url: 'docs/tutti/runbooks.md#d-redis-is-down-or-full'

      - alert: TuttiRedisUnreachableFromProxy
        expr: sum by (instance) (increase(policy_snapshot_refresh_errors_total[5m])) > 0
        for: 2m
        labels:
          severity: critical
          component: proxy
        annotations:
          summary: 'Proxy {{ $labels.instance }} cannot read the config version from Redis'
          description: 'policy_snapshot_refresh_errors_total is increasing. Non-read requests fail with 503 until Redis responds. Check the Redis process, memory limit (used_memory vs maxmemory) and network.'
          runbook_url: 'docs/tutti/runbooks.md#d-redis-is-down-or-full'

      - alert: TuttiStaleSnapshotReadsServed
        expr: sum by (instance) (increase(policy_snapshot_stale_served_total[5m])) > 0
        for: 2m
        labels:
          severity: warning
          component: proxy
        annotations:
          summary: 'Proxy {{ $labels.instance }} serves reads from a stale policy snapshot'
          description: 'Read requests were served from the last known snapshot while Redis was unreachable. Routing changes made during the outage may not be visible on this proxy yet.'
          runbook_url: 'docs/tutti/runbooks.md#d-redis-is-down-or-full'

  - name: tutti-proxy-http
    rules:
      - alert: TuttiProxy5xxRateWarning
        expr: sum(rate(proxy_response_status{status=~"5.."}[5m])) / sum(rate(proxy_response_status[5m])) > 0.02
        for: 10m
        labels:
          severity: warning
          component: proxy
        annotations:
          summary: 'More than 2% of proxy responses are 5xx'
          description: 'Share of 5xx responses from the S3 proxy over 5 minutes is {{ $value | humanizePercentage }}. Break it down by status with proxy_response_status, and check storage_available and policy_snapshot alerts first. The 2% threshold is a starting point; tune it to your normal error rate.'
          runbook_url: 'docs/tutti/runbooks.md#i-error-rate-access-denied-and-task-failure-alerts'

      - alert: TuttiProxy5xxRateCritical
        expr: sum(rate(proxy_response_status{status=~"5.."}[5m])) / sum(rate(proxy_response_status[5m])) > 0.10
        for: 5m
        labels:
          severity: critical
          component: proxy
        annotations:
          summary: 'More than 10% of proxy responses are 5xx'
          description: 'Share of 5xx responses from the S3 proxy is {{ $value | humanizePercentage }}. Clients are seeing widespread failures.'
          runbook_url: 'docs/tutti/runbooks.md#i-error-rate-access-denied-and-task-failure-alerts'

      - alert: TuttiProxyAccessDeniedSpike
        expr: sum(rate(proxy_response_status{status="403"}[5m])) > 1
        for: 10m
        labels:
          severity: warning
          component: proxy
        annotations:
          summary: 'Proxy returns more than 1 access denied (403) response per second'
          description: 'A spike in 403 responses can mean a client with a revoked or rotated access key, a policy change that removed access, or a scan. Check the access key rotation state and the access policy of the affected user. The threshold of 1 req/s is an absolute value; tune it to your traffic.'
          runbook_url: 'docs/tutti/runbooks.md#i-error-rate-access-denied-and-task-failure-alerts'

      - alert: TuttiProxyNoCredentials
        expr: sum by (storage) (increase(proxy_no_credentials_total[5m])) > 0
        for: 1m
        labels:
          severity: critical
          component: proxy
        annotations:
          summary: 'Proxy rejected requests to storage {{ $labels.storage }} because no credentials resolved (503)'
          description: 'At least one user routed to {{ $labels.storage }} has neither a per-user credential override nor a storage connection account. Set a connection account on {{ $labels.storage }} or add credentials for the affected user.'
          runbook_url: 'docs/tutti/runbooks.md#g-add-a-storage-at-runtime-and-add-credentials'

  - name: tutti-worker
    rules:
      - alert: TuttiReplicationTaskFailures
        expr: sum(rate(worker_failed_tasks_total[15m])) / sum(rate(worker_processed_tasks_total[15m])) > 0.05
        for: 15m
        labels:
          severity: warning
          component: worker
        annotations:
          summary: 'More than 5% of worker tasks fail'
          description: 'worker_failed_tasks_total counts failed attempts, including retries, divided by processed tasks. Check worker logs for the error of the failing task_type and queue. Storage breaker and credential problems are the usual causes.'
          runbook_url: 'docs/tutti/runbooks.md#i-error-rate-access-denied-and-task-failure-alerts'

      - alert: TuttiReplicationLagHigh
        expr: max by (user, from, to) (replication_unprocessed_events) > 10000
        for: 15m
        labels:
          severity: warning
          component: worker
        annotations:
          summary: 'Replication for {{ $labels.user }} ({{ $labels.from }} -> {{ $labels.to }}) has {{ $value }} unprocessed events'
          description: 'replication_unprocessed_events sums unprocessed events over the user and bucket replications of {{ $labels.user }} from {{ $labels.from }} to {{ $labels.to }}. Drill down with chorctl repl.'
          runbook_url: 'docs/tutti/runbooks.md#b-manual-failback-return-routing-to-the-original-storage'

  - name: tutti-protection-groups
    rules:
      - alert: TuttiProtectionGroupCopiesBelowWanted
        expr: protection_group_copies_healthy < protection_group_copies_wanted
        for: 15m
        labels:
          severity: warning
          component: worker
        annotations:
          summary: 'Protection group {{ $labels.group }} has {{ $value }} healthy copies, fewer than wanted'
          description: 'At least one secondary member of {{ $labels.group }} is unavailable, still initializing, lagging, unverified or quarantined. Check the group status in the console or via the API.'
          runbook_url: 'docs/tutti/protection-groups.md'

      - alert: TuttiProtectionGroupPrimaryChanged
        expr: sum by (group, reason) (increase(protection_group_primary_changes_total[10m])) > 0
        for: 1m
        labels:
          severity: warning
          component: worker
        annotations:
          summary: 'Protection group {{ $labels.group }} changed primary ({{ $labels.reason }})'
          description: 'Protection group {{ $labels.group }} promoted a new primary ({{ $labels.reason }}). Verify member health and whether any member was quarantined.'
          runbook_url: 'docs/tutti/protection-groups.md'

      - alert: TuttiProtectionGroupFrozen
        expr: max by (group) (protection_group_frozen) == 1
        for: 5m
        labels:
          severity: critical
          component: worker
        annotations:
          summary: 'Protection group {{ $labels.group }} has been frozen for more than 5 minutes'
          description: 'Writes to the scope of {{ $labels.group }} are blocked while waiting for active writers to drain, initial resync to finish, or target catch-up. Check active writers and lastError on the group.'
          runbook_url: 'docs/tutti/protection-groups.md'

      - alert: TuttiProtectionGroupSwitchBlocked
        expr: sum by (group, reason) (increase(protection_group_switch_blocked_total[5m])) > 0
        for: 1m
        labels:
          severity: critical
          component: worker
        annotations:
          summary: 'Automatic failover of protection group {{ $labels.group }} is blocked ({{ $labels.reason }})'
          description: 'A proxy quorum reported the primary of {{ $labels.group }} down, but promotion was held back by {{ $labels.reason }} (global_freeze or rate_limit).'
          runbook_url: 'docs/tutti/protection-groups.md'

      - alert: TuttiProtectionGroupReconcileFailing
        expr: sum by (group) (increase(protection_group_reconcile_errors_total[5m])) > 3
        for: 5m
        labels:
          severity: warning
          component: worker
        annotations:
          summary: 'Protection group {{ $labels.group }} reconcile keeps failing'
          description: 'The reconciler of {{ $labels.group }} failed more than 3 times in 5 minutes for 5 minutes: seeding, verification, promotion and PostgreSQL sync are not progressing. See lastError on the group and the worker logs.'
          runbook_url: 'docs/tutti/protection-groups.md'

  - name: tutti-controlplane-outbox
    rules:
      - alert: TuttiControlPlaneOutboxStalled
        expr: max(controlplane_outbox_oldest_seconds) > 30
        for: 2m
        labels:
          severity: critical
          component: worker
        annotations:
          summary: 'Control-plane outbox has unpublished changes older than {{ $value | humanize }}s'
          description: 'Committed PostgreSQL changes are not reaching the Redis projection in time. Check Redis connectivity and worker logs for control plane outbox errors.'
          runbook_url: 'docs/tutti/control-plane-db.md'

      - alert: TuttiControlPlaneOutboxFailures
        expr: sum(increase(controlplane_outbox_failures_total[5m])) > 0
        for: 2m
        labels:
          severity: warning
          component: worker
        annotations:
          summary: 'Control-plane outbox failed to publish changes to Redis'
          description: 'controlplane_outbox_failures_total is increasing. The publisher retries with exponential backoff; check Redis health.'
          runbook_url: 'docs/tutti/control-plane-db.md'

      - alert: TuttiControlPlaneDegraded
        expr: min(controlplane_postgres_ready) < 1
        for: 2m
        labels:
          severity: critical
          component: worker
        annotations:
          summary: 'A worker runs without its control-plane PostgreSQL (read-only, Redis projection)'
          description: 'controlplane_postgres_ready is 0: the database was unreachable at start. The worker serves the Redis projection and rejects configuration changes until it connects.'
          runbook_url: 'docs/tutti/control-plane-db.md'

  # TODO(metrics): worker cannot reach Redis. The worker has no general Redis error counter yet.
