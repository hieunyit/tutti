name: E2E tests
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - ".github/**"
      - "ui/**"
      - "**.go"
      - "**/config.yaml"
      - "**/proto/**"
jobs:
  unit:
    name: Vet and unit tests (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.26.10"
      - name: go vet
        run: go vet ./...
      - name: Unit tests with race detector
        run: go test -race -count=1 ./pkg/... ./service/...
  test:
    name: E2E tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.26.10"
      # `make test` runs `go test ./...`, which includes the e2e packages under ./test/... (test/resilience among them)
      - name: make test
        run: make test TEST_WAIT_SHORT=20s TEST_WAIT_LONG=80s
      - name: Run Proto Generation
        run: make proto-gen
      - name: Check for Uncommitted Changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            # Capture the list of uncommitted files
            UNCOMMITTED_FILES=$(git status --porcelain)
            echo "::error::Proto generation step has uncommitted changes: $UNCOMMITTED_FILES"
            echo "Please run the following command locally and commit the results:"
            echo "- \`./proto/gen_proto.sh\`"
            exit 1
          else
            echo "Proto generation check passed. No uncommitted changes."
          fi
  ui:
    name: UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      # the UI pins yarn 1 via "packageManager" and ships yarn.lock (no package-lock.json)
      - name: Enable corepack (yarn)
        run: corepack enable
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Type check
        run: yarn lint:types
      - name: ESLint
        run: yarn lint:eslint
      - name: Unit tests
        run: yarn test:unit --run
      - name: Build
        run: yarn build
