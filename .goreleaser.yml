project_name: tutti
before:
  hooks:
    - go mod tidy
builds:
  - binary: tuttictl
    dir: tools/tuttictl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    ignore:
      - goos: darwin
        goarch: 386
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: arm64
archives:
  - name_template: tuttictl_{{ .Tag }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - none*
checksum:
  name_template: checksums.txt
brews:
  - name: tuttictl
    repository:
      owner: clyso
      name: homebrew-tap
      token: '{{ .Env.BREW_RELEASE_TOKEN }}'
    commit_author:
      name: clyso_bot
      email: release-bot@clyso.com
    commit_msg_template: Brew formula update for tuttictl version {{ .Tag }}
    folder: Formula
    homepage: https://github.com/clyso/chorus
    description: Management CLI for tutti service
    license: Apache-2.0
    test: |
      system "#{bin}/tuttictl --version"
    install: |
      bin.install "tuttictl"
release:
  github:
    owner: clyso
    name: tutti
  extra_files:
    - glob: ./standalone/*
changelog:
  use: github-native
