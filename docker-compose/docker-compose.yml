volumes:
  # Volume to preserve chorus data between restarts
  redis-data:
  # Volume to preserve PostgreSQL control-plane data between restarts
  postgres-data:
services:
  # PostgreSQL - control-plane database (Phase 6) for durable config, multi-object transactions, and audit log
  postgres:
    image: "${POSTGRES_IMAGE:-postgres:16-alpine}"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-tutti}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-tutti}
      - POSTGRES_DB=${POSTGRES_DB:-tutti}
    expose:
      - 5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-tutti} -d $${POSTGRES_DB:-tutti}"]
      interval: 2s
      timeout: 5s
      retries: 15
  # Redis - required component to run chorus
  # Redis is used by all chorus components to store metadata
  # and coordinate work between them
  redis:
    # Pinned to the version validated by the restore drill; override deliberately.
    image: "${REDIS_IMAGE:-redis@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53}"
    # Demo guardrail; size production Redis for metadata/queue growth and AOF overhead.
    # With noeviction, reaching this limit rejects writes instead of losing state.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - ${REDIS_MAXMEMORY:-512mb}
      - --maxmemory-policy
      - noeviction
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - REDIS_PORT_NUMBER=6379
    expose:
      - 6379
    volumes:
      - redis-data:/data
  # Chorus components
  # Chorus worker - main component that processes data
  worker:
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    build:
      context: ../
      args:
        SERVICE: worker
    environment:
      # Same variables as the postgres service, so overriding POSTGRES_USER/PASSWORD/DB keeps the worker in sync
      # (CFG_ overrides worker-conf.yaml: controlPlane.postgres.dsn). URL-encode special characters in the password.
      - CFG_CONTROLPLANE_POSTGRES_DSN=postgres://${POSTGRES_USER:-tutti}:${POSTGRES_PASSWORD:-tutti}@postgres:5432/${POSTGRES_DB:-tutti}?sslmode=disable
    volumes:
      - type: bind
        # worker-specific config
        source: ./worker-conf.yaml
        target: /bin/config/config.yaml
      - type: bind
        # common config: s3 credentials
        source: ./s3-credentials.yaml
        target: /bin/config/override.yaml
    ports:
      - "9671:9671" # expose REST api for tuttictl and web UI
      - "9670:9670" # expose grpc management API
  # Chorus S3 proxy
  # Can be used capture data change and backup it with worker to another S3.
  # Can be used to migrate to another S3 by bucket. Before migration it will route all requests to old S3.
  # After migration it will route all requests to new S3.
  proxy:
    # To enable run with proxy profile: "docker-compose up --profile proxy up". See https://docs.docker.com/compose/profiles/
    profiles:
      - "proxy"
    depends_on:
      - redis
    build:
      context: ../
      args:
        SERVICE: proxy
    volumes:
      # proxy config
      - type: bind
        source: ./proxy-conf.yaml
        target: /bin/config/config.yaml
      # common config: s3 credentials
      - type: bind
        source: ./s3-credentials.yaml
        target: /bin/config/override.yaml
    ports:
      - "9669:9669" # expose proxy s3 api
  # Chorus web UI
  # Access UI on http://localhost:8080
  web-ui:
    depends_on:
      - worker
    build:
      context: ../ui
      dockerfile: Dockerfile
      # repository docs and OpenAPI spec for the Documentation and API reference pages
      additional_contexts:
        docs: ../docs
        proto: ../proto
    ports:
      - "8080:80"
    environment:
      # URL to worker REST API
      - "BACKEND_URL=http://worker:9671"
