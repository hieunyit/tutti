api:
  enabled: true # set true to enable management api
  grpcPort: 9670
  httpPort: 9671
  secure: false
  # DEMO ONLY sign-in for the management API and web UI: admin/admin (role admin), viewer/viewer (role viewer).
  # Change these before any real use. Generate production hashes as described in service/worker/config.yaml
  # (bcrypt, cost 10: htpasswd -nbBC 10 "" 'password' | tr -d ':\n').
  auth:
    enabled: true
    sessionTTL: 12h
    users:
      - username: admin
        passwordHash: "$2a$10$i3sMA.JflbLfYy0COwREu.8PIacpCJyLjdY1gqUXmmqH9HprmIU0S" # bcrypt("admin"), demo only
        role: admin
      - username: viewer
        passwordHash: "$2a$10$8OnPANAIaWMZQIj.rdsRP.5EGHtVUqEonF25xKtIcIEYQ31ur/D3K" # bcrypt("viewer"), demo only
        role: viewer
log:
  json: false # false for dev console logger, true - json log for prod to export to Grafana&Loki.
  level: info
metrics:
  enabled: false
  port: 9090
trace:
  enabled: false
  endpoint: # url to Jaeger or other open trace provider
redis:
  address: "redis:6379"
# Control-plane database (Phase 6): PostgreSQL holds durable configuration and audit logs,
# and projects changes into Redis via the transactional outbox so proxies need no PostgreSQL connection.
controlPlane:
  backend: postgres # redis | postgres
  readOnly: false
  postgres:
    dsn: "postgres://tutti:tutti@postgres:5432/tutti?sslmode=disable"
    maxConns: 10
    autoMigrate: true
features:
  tagging: false # sync object/bucket tags
  acl: false # sync object/bucket ACLs
  lifecycle: false # sync bucket Lifecycle
  policy: false # sync bucket Policies
  preserveACLGrants: false # preserve object/bucket ACL Grants from source

