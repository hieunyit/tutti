storage:
  main: main
  # Dynamic credentials (used by proxy accounts). Needed in BOTH worker and proxy.
  # DEMO ONLY master password: config values are not env-expanded, so ${VAR} syntax does NOT work here.
  # To keep the password out of this file, set the envar CFG_STORAGE_DYNAMICCREDENTIALS_MASTERPASSWORD
  # (the loader's CFG_ override, see pkg/config/loader.go); it overrides this value in both services.
  # Changing the master password makes already stored proxy/storage secrets unreadable. Minimum length 12.
  dynamicCredentials:
    enabled: true
    masterPassword: "demo-master-password-change-me"
    pollInterval: 3s
