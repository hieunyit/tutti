log:
  json: false # false for dev console logger, true - json log for prod to export to Grafana&Loki.
  level: info
metrics:
  enabled: false
  port: 9090
trace:
  enabled: false
  endpoint: # url to Jaeger or other open trace provider
redis:
  # redis master address for standalone installation
  # will be ignored if addresses is set.
  # This fiel is deprecated. Use addresses instead.
  address: "127.0.0.1:6379"
  # List of redis addresses for HA (cluster or sentinel) setup.
  # For standalone redis setup add a single address to the list.
  addresses: []
  user:
  password:
  tls:
    enabled: false
    insecure: false
  sentinel:
    masterName:
    user:
    password:
  metaDB: 0
  queueDB: 1
  lockDB: 2
  configDB: 3
  # Optional per-role overrides: put config / queue / lock / meta data on separate Redis instances
  # (each may then use DB 0). Unset fields inherit from the settings above. Example in docs/tutti/configuration.md.
  # Redis Cluster is not supported (it only has DB 0 and the Lua/multi-key transactions need one node).
  config:
    addresses: []
    user:
    password:
    tls: "" # "" inherit, "true"/"false" override
    db: # logical DB on that instance; unset = the role's *DB key above (set in YAML, e.g. db: 0)
    sentinel:
      masterName:
      user:
      password:
  queue:
    addresses: []
    user:
    password:
    tls: "" # "" inherit, "true"/"false" override
    db: # logical DB on that instance; unset = the role's *DB key above (set in YAML, e.g. db: 0)
    sentinel:
      masterName:
      user:
      password:
  lock:
    addresses: []
    user:
    password:
    tls: "" # "" inherit, "true"/"false" override
    db: # logical DB on that instance; unset = the role's *DB key above (set in YAML, e.g. db: 0)
    sentinel:
      masterName:
      user:
      password:
  meta:
    addresses: []
    user:
    password:
    tls: "" # "" inherit, "true"/"false" override
    db: # logical DB on that instance; unset = the role's *DB key above (set in YAML, e.g. db: 0)
    sentinel:
      masterName:
      user:
      password:
features:
  versioning: false #
  autoMigrate: false # initiate migration from main to other storages on startup
  tagging: true # sync object/bucket tags
  acl: true # sync object/bucket ACLs
  lifecycle: false # sync bucket Lifecycle
  policy: false # sync bucket Policies
  preserveACLGrants: false # preserve object/bucket ACL Grants from source
controlPlane:
  backend: redis # redis | postgres
  readOnly: false
  postgres:
    dsn: ""
    maxConns: 10
    minConns: 0
    connMaxLifetime: 30m
    connMaxIdleTime: 5m
    connectTimeout: 5s
    statementTimeout: 10s
    autoMigrate: false
  outbox:
    pollInterval: 500ms
    batchSize: 200
    retryBackoff: 1s
    maxBackoff: 1m
    retention: 24h
