syntax = "proto3";

package chorus;

import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/hieunyit/tutti/proto/chorus;pb";

// Resilience exposes the high-availability state of the proxies (circuit breaker status and effective
// settings) and manages automatic failover policies and the history of performed failovers.
service Resilience {
  rpc ListRuntimeStorages(ListRuntimeStoragesRequest) returns (RuntimeStorageList);
  rpc CreateRuntimeStorage(CreateRuntimeStorageRequest) returns (RuntimeStorage);
  rpc UpdateRuntimeStorage(UpdateRuntimeStorageRequest) returns (RuntimeStorage);
  rpc DeleteRuntimeStorage(RuntimeStorageName) returns (google.protobuf.Empty);
  rpc TestRuntimeStorage(TestRuntimeStorageRequest) returns (TestS3UserCredentialsResponse);
  // GetRuntimeStorage returns one storage with its connection account (never the secret) and the last connection test.
  rpc GetRuntimeStorage(RuntimeStorageName) returns (RuntimeStorage);
  // TestStorageConnection runs the connection checks of the scale plan (2.4) against unsaved settings (storage +
  // connection_account) or an existing storage (name). It never fails because a check failed: the failing steps are in
  // the result. Results of existing storages are stored with the storage (last_test).
  rpc TestStorageConnection(TestStorageConnectionRequest) returns (StorageTestResult);
  // RotateStorageConnectionAccount replaces the connection account of a storage: the new account is tested first,
  // then switched atomically. The previous account is kept (sealed) so that proxies that have not polled yet keep working.
  rpc RotateStorageConnectionAccount(RotateStorageConnectionAccountRequest) returns (RuntimeStorage);

  // GetProxyStatus returns all live proxy instances with the health of their storages and effective settings.
  // Proxies publish their status periodically; an instance that stopped publishing disappears after a short TTL.
  rpc GetProxyStatus(google.protobuf.Empty) returns (ProxyStatusList);

  // GetStatsHistory returns the traffic rates of all proxies over the last `range` (5m, 15m, 1h or 6h), summed
  // across proxies per time bucket (10s; 30s for 1h; 2m for 6h), plus the latest rates of every proxy.
  // Proxies record a sample every 10s into Redis (kept 6h), so history survives UI reloads.
  rpc GetStatsHistory(StatsHistoryRequest) returns (StatsHistory);

  // GetWorkerStats returns the replication throughput snapshots published by the live worker processes
  // (every 5s, TTL 20s) plus their aggregated totals.
  rpc GetWorkerStats(google.protobuf.Empty) returns (WorkerStatsResponse);

  // ListFailoverPolicies returns all failover policies sorted by source storage.
  rpc ListFailoverPolicies(google.protobuf.Empty) returns (FailoverPolicyList);

  // SetFailoverPolicy creates or replaces the failover policy of a source storage.
  // Source and targets must be configured storages.
  rpc SetFailoverPolicy(FailoverPolicy) returns (google.protobuf.Empty);

  // DeleteFailoverPolicy removes the failover policy of a source storage.
  rpc DeleteFailoverPolicy(FailoverPolicySource) returns (google.protobuf.Empty);

  // ListFailoverEvents returns the performed failovers that were not yet cleared.
  rpc ListFailoverEvents(google.protobuf.Empty) returns (FailoverEventList);

  // DeleteFailoverEvent clears the record of a performed failover, e.g. after manual failback.
  rpc DeleteFailoverEvent(FailoverEventID) returns (google.protobuf.Empty);

  // ListAccessPolicies returns all proxy account access policies sorted by user.
  rpc ListAccessPolicies(google.protobuf.Empty) returns (AccessPolicyList);

  // SetAccessPolicy creates or replaces the access policy of a proxy user.
  // Proxies pick up changes within a few seconds (policy cache TTL).
  rpc SetAccessPolicy(AccessPolicy) returns (google.protobuf.Empty);

  // DeleteAccessPolicy removes the access policy of a proxy user: the user gets full access again.
  rpc DeleteAccessPolicy(AccessPolicyUser) returns (google.protobuf.Empty);

  // ListProxyAccounts returns the accounts able to authenticate against live proxies (users of storage credentials
  // used by the proxy and custom credentials) with their effective access policy. Secrets are never returned.
  // Runtime-managed ("dynamic") accounts are listed with source "dynamic" and their lifecycle metadata.
  rpc ListProxyAccounts(google.protobuf.Empty) returns (ProxyAccountList);

  // CreateProxyAccount creates a runtime-managed proxy account for an existing storage user and returns the
  // generated access key id and secret. The secret is returned ONLY in this response.
  // Fails with FailedPrecondition if the dynamic credentials master password is not configured.
  rpc CreateProxyAccount(CreateProxyAccountRequest) returns (ProxyAccountSecret);

  // RotateProxyAccountSecret generates a new secret. The previous secret keeps working for grace_period.
  // The new secret is returned ONLY in this response.
  rpc RotateProxyAccountSecret(RotateProxyAccountSecretRequest) returns (ProxyAccountSecret);

  // SetProxyAccountStatus enables ("active") or disables ("disabled") a dynamic account.
  rpc SetProxyAccountStatus(SetProxyAccountStatusRequest) returns (google.protobuf.Empty);

  // DeleteProxyAccount permanently removes a dynamic account.
  rpc DeleteProxyAccount(ProxyAccountKey) returns (google.protobuf.Empty);

  // ListS3Users returns the union of all users across storages with the credential state per storage (never the
  // secret), the proxy access key counts and the access policy summary.
  rpc ListS3Users(google.protobuf.Empty) returns (S3UserList);

  // CreateS3User creates a user with dynamic credentials on the given storages (the main storage is required),
  // optionally verifying them first, setting an access policy and creating the first proxy access key.
  // Fails with FailedPrecondition if dynamic credentials are not enabled. Partial changes are rolled back.
  rpc CreateS3User(CreateS3UserRequest) returns (CreateS3UserResponse);

  // UpdateS3UserCredentials sets or replaces the dynamic credentials of an existing user on one storage.
  // Credentials defined in the worker config cannot be changed (FailedPrecondition).
  rpc UpdateS3UserCredentials(UpdateS3UserCredentialsRequest) returns (google.protobuf.Empty);

  // DeleteS3UserCredentials removes the dynamic per-user credentials (override) of a user on one storage; the user
  // then falls back to the storage connection account. Admin only. FailedPrecondition if the credentials come from
  // config, or if the user would be left without credentials on a storage without connection account while
  // replications, routings or failover events reference the user.
  rpc DeleteS3UserCredentials(DeleteS3UserCredentialsRequest) returns (google.protobuf.Empty);

  // DeleteS3User removes the dynamic credentials, dynamic proxy access keys and the access policy of a user.
  // Refused with FailedPrecondition (listing all reasons) if any credentials come from config or if replications,
  // routings or failover events reference the user. Active access keys also block deletion unless force is set.
  rpc DeleteS3User(DeleteS3UserRequest) returns (DeleteS3UserResponse);

  // TestS3UserCredentials checks credentials against one storage with a ListBuckets call.
  // Uses the given credentials or, if not given, the stored credentials of the user.
  rpc TestS3UserCredentials(TestS3UserCredentialsRequest) returns (TestS3UserCredentialsResponse);

  // ListConsoleUsers returns the users able to sign in to the management API: config users (read-only) and
  // managed users stored in Redis. Never returns password hashes. Admin only.
  rpc ListConsoleUsers(google.protobuf.Empty) returns (ConsoleUserList);

  // CreateConsoleUser creates a managed console user with a given or a generated (returned once) password.
  rpc CreateConsoleUser(CreateConsoleUserRequest) returns (CreateConsoleUserResponse);

  // UpdateConsoleUser changes the role and/or the disabled flag of a managed user. Sessions are affected immediately.
  rpc UpdateConsoleUser(UpdateConsoleUserRequest) returns (google.protobuf.Empty);

  // ResetConsoleUserPassword sets or generates a new password of a managed user, forces a password change at the
  // next login and revokes all sessions of the user.
  rpc ResetConsoleUserPassword(ResetConsoleUserPasswordRequest) returns (ResetConsoleUserPasswordResponse);

  // DeleteConsoleUser removes a managed user. Its sessions stop working immediately.
  rpc DeleteConsoleUser(ConsoleUserName) returns (google.protobuf.Empty);

  // GetProxyFleetConfig returns the centralized proxy fleet configuration (cluster defaults + per-group overrides).
  rpc GetProxyFleetConfig(google.protobuf.Empty) returns (ProxyFleetConfig);

  // SetProxyFleetConfig updates the centralized proxy fleet configuration and bumps its version.
  rpc SetProxyFleetConfig(SetProxyFleetConfigRequest) returns (ProxyFleetConfig);

  // ListAuditLog returns control-plane audit log entries matching the filter (newest first).
  rpc ListAuditLog(ListAuditLogRequest) returns (AuditLogList);

  // GetSystemSettings returns dynamic cluster features, worker performance tuning, and operational parameters.
  rpc GetSystemSettings(google.protobuf.Empty) returns (SystemSettings);

  // UpdateSystemSettings updates dynamic cluster features, worker performance tuning, and operational parameters.
  rpc UpdateSystemSettings(UpdateSystemSettingsRequest) returns (SystemSettings);
}

message CreateProxyAccountRequest {
  // Storage user the proxy acts as for this account. Must have storage credentials.
  string user = 1;
  string description = 2;
}

// ProxyAccountSecret is returned once, when a secret is generated.
message ProxyAccountSecret {
  string access_key_id = 1;
  string secret_access_key = 2;
  // Set after a rotation with a grace period: until then the previous secret still works.
  google.protobuf.Timestamp previous_secret_expires_at = 3;
}

message RotateProxyAccountSecretRequest {
  string access_key_id = 1;
  // How long the previous secret keeps working. Unset means 1h, zero means immediate invalidation.
  google.protobuf.Duration grace_period = 2;
}

message SetProxyAccountStatusRequest {
  string access_key_id = 1;
  // "active" or "disabled".
  string status = 2;
}

message ProxyAccountKey {
  string access_key_id = 1;
}

// ProxyAccessKey describes one runtime-managed access key (never its secret).
message ProxyAccessKey {
  string access_key_id = 1;
  // Always "dynamic".
  string source = 2;
  // "active" or "disabled".
  string status = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp rotated_at = 5;
  // Set while a rotated-out secret is still valid.
  google.protobuf.Timestamp previous_secret_expires_at = 6;
  string description = 7;
}

// AccessPolicy restricts what a proxy user (the Chorus user name, not the access key id) may do.
message AccessPolicy {
  // Proxy user name.
  string user = 1;
  // "read-write", "read-only" or "write-only".
  string permission = 2;
  // Allowed bucket glob patterns, e.g. ["photos-*", "logs"]. Empty or ["*"] means all buckets.
  repeated string buckets = 3;
  string description = 4;
}

message AccessPolicyList {
  repeated AccessPolicy policies = 1;
}

message AccessPolicyUser {
  string user = 1;
}

// ProxyAccount is a proxy user with its access key ids and effective policy.
message ProxyAccount {
  string user = 1;
  // Access key ids (never secrets).
  repeated string access_key_ids = 2;
  // Where credentials come from: "custom" or "storage:<name>".
  repeated string sources = 3;
  // Effective policy: the stored one, or read-write on all buckets if none is stored.
  AccessPolicy policy = 4;
  // True if a policy is stored for the user.
  bool has_policy = 5;
  // Runtime-managed access keys of the user with lifecycle metadata. Their ids are also in access_key_ids
  // and "dynamic" is in sources.
  repeated ProxyAccessKey dynamic_keys = 6;
}

message ProxyAccountList {
  repeated ProxyAccount accounts = 1;
  // Whether CreateProxyAccount can work at all.
  DynamicAccountsStatus dynamic_accounts = 2;
}

// DynamicAccountsStatus tells whether runtime-managed proxy accounts can be created.
message DynamicAccountsStatus {
  // True if storage.dynamicCredentials is enabled with a masterPassword and encryption on.
  bool available = 1;
  // Human readable explanation if not available.
  string reason = 2;
}

// StorageHealth is the circuit breaker state of one storage as seen by one proxy.
message StorageHealth {
  // Storage name as configured.
  string name = 1;
  // True while the circuit breaker is closed.
  bool available = 2;
  // Number of consecutive availability failures.
  int32 consecutive_failures = 3;
  // Last availability error, empty if none.
  string last_error = 4;
  // Time of the last breaker state change.
  google.protobuf.Timestamp last_change = 5;
}

// SyncSettings are the effective synchronous replication settings of a proxy.
message SyncSettings {
  // True if objects are copied to destinations before answering the client.
  bool enabled = 1;
  // Number of copies (main included) required before answering. 0 means main plus all destinations.
  int32 write_quorum = 2;
  // Max time spent syncing destinations per request.
  google.protobuf.Duration timeout = 3;
  // Behavior when the quorum is not reached: "fail" responds 503, "accept" forwards the main response.
  string on_quorum_failure = 4;
}

// ReplicationSettings are the effective replication settings of a proxy.
message ReplicationSettings {
  // Behavior when the replication event cannot be recorded: "fail" or "log".
  string on_event_error = 1;
  // Total time to retry recording the replication event.
  google.protobuf.Duration event_retry_budget = 2;
  // Synchronous replication settings.
  SyncSettings sync = 3;
}

// HealthSettings are the effective circuit breaker settings of a proxy.
message HealthSettings {
  // Consecutive failures that open a breaker.
  int32 failure_threshold = 1;
  // How long an open breaker rejects requests before one trial is allowed.
  google.protobuf.Duration open_duration = 2;
}

// FailoverSettings are the effective failover controller defaults of a proxy.
message FailoverSettings {
  // True if the automatic failover controller runs in this proxy.
  bool enabled = 1;
  // How often the controller evaluates failover conditions.
  google.protobuf.Duration check_interval = 2;
  // Default time the source breaker must be continuously open, for policies that omit it.
  google.protobuf.Duration after = 3;
  // Default max unreplicated events allowed, for policies that omit it.
  int32 max_event_lag = 4;
}

// ProxySettings are the effective settings of a proxy.
message ProxySettings {
  // Replication settings.
  ReplicationSettings replication = 1;
  // Circuit breaker settings.
  HealthSettings health = 2;
  // Failover controller defaults.
  FailoverSettings failover = 3;
  // True if SigV4 requests without a signed Content-Type header are rejected.
  bool require_signed_content_type = 4;
  // Max time to read HTTP request headers (non-hot-reloadable; changing requires proxy restart).
  google.protobuf.Duration read_header_timeout = 5;
  // Protection group writer lease TTL (non-hot-reloadable; changing requires proxy restart).
  google.protobuf.Duration writer_lease = 6;
  // Graceful drain wait on SIGTERM.
  google.protobuf.Duration drain_delay = 7;
  // Max Redis staleness before /ready returns 503.
  google.protobuf.Duration ready_max_staleness = 8;
}

// ProxyStatus is the status of one live proxy instance.
message ProxyStatus {
  // Unique id of the proxy instance.
  string app_id = 1;
  // Public address of the proxy.
  string address = 2;
  // Time the proxy started.
  google.protobuf.Timestamp started_at = 3;
  // Time of the last status update.
  google.protobuf.Timestamp updated_at = 4;
  // Health of every storage, as seen by this proxy.
  repeated StorageHealth storages = 5;
  // Effective settings.
  ProxySettings settings = 6;
  // Built-in traffic statistics (no Prometheus needed). Absent for proxies that do not publish them.
  // Counters are cumulative since stats.started_at: compute rates from two snapshots with the same
  // started_at (a changed started_at means the proxy restarted and counters were reset).
  TrafficStats stats = 7;
  // Current rates computed by the proxy over a sliding window of ~10s (no need to diff two snapshots).
  // Absent for proxies that do not publish them. Settings.failover tells whether the failover controller runs.
  TrafficRates rates = 8;
  // Proxy group name (default "default").
  string group = 9;
  // Central fleet configuration version applied by this proxy.
  int64 applied_config_version = 10;
  // True when central fleet configuration changed a setting that requires a proxy restart.
  bool pending_restart = 11;
  // Names of settings that require a proxy restart to take effect.
  repeated string pending_restart_reasons = 12;
  // Set when the latest central fleet configuration was rejected by this proxy (invalid document or effective
  // settings); the proxy keeps running on the last good configuration (applied_config_version).
  string config_error = 13;
}

// TrafficRates are per-second traffic rates over a short window. Latencies are in milliseconds.
message TrafficRates {
  // Time span the rates were computed over (0 right after proxy start).
  double window_seconds = 1;
  double requests_per_sec = 2;
  // Requests/s by operation class: read, write, exists, manage, other.
  map<string, double> requests_by_class = 3;
  // Requests/s by the storage they were routed to.
  map<string, double> requests_by_storage = 4;
  double bytes_in_per_sec = 5;
  double bytes_out_per_sec = 6;
  double status_4xx_per_sec = 7;
  double status_5xx_per_sec = 8;
  double fail_fast_per_sec = 9;
  double access_denied_per_sec = 10;
  // Mean request duration in the window. When summed over proxies: request-weighted average.
  double latency_avg_ms = 11;
  // 95th percentile estimated from histogram deltas. When combined over proxies or buckets: the MAXIMUM of the
  // parts (an upper bound), because percentiles cannot be merged exactly.
  double latency_p95_ms = 12;
}

message StatsHistoryRequest {
  // One of "5m", "15m", "1h", "6h". Default "15m".
  string range = 1;
}

// StatsHistoryPoint is one time bucket with the rates summed across all proxies.
message StatsHistoryPoint {
  google.protobuf.Timestamp time = 1;
  TrafficRates rates = 2;
}

// ProxyLatestRates is the most recent history sample of one proxy.
message ProxyLatestRates {
  string app_id = 1;
  google.protobuf.Timestamp time = 2;
  TrafficRates rates = 3;
}

message StatsHistory {
  string range = 1;
  // Bucket size: 10s (5m, 15m), 30s (1h), 2m (6h).
  google.protobuf.Duration bucket = 2;
  // Ascending by time; buckets without any sample are omitted.
  repeated StatsHistoryPoint points = 3;
  // Latest sample of every proxy that recorded one within the range.
  repeated ProxyLatestRates proxies = 4;
}

// TrafficStats are cumulative in-memory traffic counters of one proxy instance.
// For per-replication backlog (events, events_done, event_lag) use Policy/ListReplications.
message TrafficStats {
  // Time the snapshot was taken.
  google.protobuf.Timestamp collected_at = 1;
  // Time the counters started (proxy process start).
  google.protobuf.Timestamp started_at = 2;
  // Total requests handled.
  uint64 requests_total = 3;
  // Requests by operation class: read, write, exists, manage, other.
  map<string, uint64> requests_by_class = 4;
  // Requests by the storage they were routed to (requests rejected before routing are not included).
  map<string, uint64> requests_by_storage = 5;
  // Responses with status 2xx.
  uint64 responses_2xx = 6;
  // Responses with status 3xx.
  uint64 responses_3xx = 7;
  // Responses with status 4xx.
  uint64 responses_4xx = 8;
  // Responses with status 5xx.
  uint64 responses_5xx = 9;
  // Requests rejected immediately because the storage circuit breaker is open.
  uint64 fail_fast = 10;
  // Requests denied by an access policy.
  uint64 access_denied = 11;
  // Requests answered 503 because the replication event could not be recorded.
  uint64 event_record_failed = 12;
  // Synchronous replication: write quorum reached.
  uint64 sync_quorum_reached = 13;
  // Synchronous replication: fewer copies than the write quorum.
  uint64 sync_below_quorum = 14;
  // Synchronous replication enabled but nothing to replicate synchronously for the request.
  uint64 sync_skipped = 15;
  // aws-chunked payload verification failures.
  uint64 chunked_verify_failed = 16;
  // Bytes read from clients (request bodies).
  uint64 bytes_in = 17;
  // Bytes written to clients (response bodies).
  uint64 bytes_out = 18;
  // Request duration histogram.
  LatencyHistogram latency = 19;
  // Responses with a status outside 2xx-5xx.
  uint64 responses_other = 20;
  // Requests failed with 503 because the storage has no credentials for the user (no override, no connection account).
  uint64 no_credentials = 21;
}

// LatencyHistogram is a fixed-bucket histogram of full request durations.
message LatencyHistogram {
  // Number of observations.
  uint64 count = 1;
  // Sum of all durations in seconds (average = sum_seconds / count).
  double sum_seconds = 2;
  // Inclusive upper bounds of the buckets in seconds.
  repeated double bounds_seconds = 3;
  // Non-cumulative bucket counts: len(bounds_seconds)+1 items, the last one is the +Inf bucket.
  repeated uint64 buckets = 4;
}

// ProxyStatusList lists live proxies.
message ProxyStatusList {
  // Live proxy instances sorted by app id.
  repeated ProxyStatus proxies = 1;
  // Current rates summed across the listed proxies (latency: request-weighted average, p95: maximum).
  TrafficRates total_rates = 2;
  // Latest central proxy fleet configuration version (0 when no central config was saved yet).
  int64 config_version = 3;
}

// FailoverPolicy defines which storages may be promoted when the source storage is down.
message FailoverPolicy {
  // Source storage that may fail. Required, must be a configured storage.
  string source = 1;
  // True to allow the proxy to fail over automatically. An enabled policy needs at least one target.
  bool enabled = 2;
  // Only storages that may be promoted, in order of preference. Must be configured and differ from the source.
  repeated string targets = 3;
  // How long the source breaker must be continuously open. Unset or zero means the proxy default.
  google.protobuf.Duration after = 4;
  // Max number of unreplicated events allowed on the replication to the target. Unset means the proxy default.
  optional int32 max_event_lag = 5;
}

// FailoverPolicyList lists failover policies.
message FailoverPolicyList {
  // Policies sorted by source.
  repeated FailoverPolicy policies = 1;
}

// FailoverPolicySource identifies a failover policy.
message FailoverPolicySource {
  // Source storage of the policy.
  string source = 1;
}

// FailoverEvent describes one performed failover.
message FailoverEvent {
  // User whose routing was switched.
  string user = 1;
  // Bucket whose routing was switched. Empty for a user-level failover.
  string bucket = 2;
  // Storage that was the routing target before the failover.
  string from = 3;
  // Storage promoted by the failover.
  string to = 4;
  // Time of the failover.
  google.protobuf.Timestamp time = 5;
  // Number of unreplicated events at failover time.
  int32 event_lag = 6;
}

// FailoverEventList lists performed failovers.
message FailoverEventList {
  // Events sorted by scope.
  repeated FailoverEvent events = 1;
}

// FailoverEventID identifies a failover event.
message FailoverEventID {
  // User of the event.
  string user = 1;
  // Bucket of the event. Empty for a user-level event.
  string bucket = 2;
}

// S3UserStorage is the credential state of an S3 user on one storage.
message S3UserStorage {
  string storage = 1;
  // True if the user has credentials on this storage.
  bool configured = 2;
  // "config" or "dynamic" (empty if not configured).
  string source = 3;
  // Never the secret. Empty for mode "connection-account" and "missing".
  string access_key_id = 4;
  // How the proxy and the worker sign requests of this user to the storage: "override" (per-user credentials),
  // "connection-account" (the storage connection account) or "missing" (requests fail with 503).
  string mode = 5;
}

message S3UserAccessKeys {
  // Keys of the user defined by config (storage credentials and custom auth) reported by live proxies.
  int32 static = 1;
  int32 dynamic_active = 2;
  int32 dynamic_disabled = 3;
}

message S3UserPolicy {
  bool has_policy = 1;
  // Effective permission: the stored one or "read-write".
  string permission = 2;
  repeated string buckets = 3;
}

message S3User {
  string name = 1;
  // One entry for every configured storage.
  repeated S3UserStorage storages = 2;
  // True if every S3 storage can be resolved for the user: an override or a connection account on each storage.
  bool complete = 3;
  S3UserAccessKeys access_keys = 4;
  S3UserPolicy policy = 5;
}

message S3UserList {
  repeated S3User users = 1;
  string main_storage = 2;
  repeated string storages = 3;
  // True if users can be created and changed at runtime.
  bool dynamic_credentials_enabled = 4;
}

message S3UserCredential {
  string storage = 1;
  string access_key_id = 2;
  string secret_access_key = 3;
}

message CreateS3UserRequest {
  string name = 1;
  // Optional per-user credentials (overrides). May be empty if every S3 storage has a connection account; every storage
  // without a connection account needs one entry.
  repeated S3UserCredential credentials = 2;
  // Check every credential with a ListBuckets call before saving anything.
  bool verify = 3;
  // Create the first proxy access key. Its secret is returned only once.
  bool create_access_key = 4;
  string description = 5;
  // Optional access policy (its user field is ignored).
  optional AccessPolicy policy = 6;
}

message S3UserVerifyResult {
  string storage = 1;
  bool ok = 2;
  string error = 3;
  int64 latency_ms = 4;
}

message CreateS3UserResponse {
  S3User user = 1;
  // Set if create_access_key was requested.
  ProxyAccountSecret access_key = 2;
  // Set if verify was requested.
  repeated S3UserVerifyResult verification = 3;
}

message UpdateS3UserCredentialsRequest {
  string user = 1;
  S3UserCredential credential = 2;
  // Check the credentials with a ListBuckets call before saving.
  bool verify = 3;
}

message DeleteS3UserCredentialsRequest {
  string name = 1;
  string storage = 2;
}

message DeleteS3UserRequest {
  string name = 1;
  // Also delete active proxy access keys. Never overrides config credentials or references.
  bool force = 2;
}

message DeleteS3UserResponse {
  repeated string deleted_storages = 1;
  int32 deleted_access_keys = 2;
  bool deleted_policy = 3;
}

message TestS3UserCredentialsRequest {
  string user = 1;
  string storage = 2;
  // Credentials to test. If not set, the stored credentials of the user are used.
  optional S3UserCredential credential = 3;
}

message TestS3UserCredentialsResponse {
  bool ok = 1;
  string error = 2;
  int64 latency_ms = 3;
}

message ConsoleUser {
  string username = 1;
  // "admin" or "viewer".
  string role = 2;
  // "config" (read-only) or "managed".
  string source = 3;
  bool disabled = 4;
  bool must_change_password = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  google.protobuf.Timestamp last_login_at = 8;
  google.protobuf.Timestamp password_changed_at = 9;
}

message ConsoleUserList {
  repeated ConsoleUser users = 1;
}

message ConsoleUserName {
  string username = 1;
}

message CreateConsoleUserRequest {
  string username = 1;
  string role = 2;
  // Either password or generate_password.
  string password = 3;
  bool generate_password = 4;
}

message CreateConsoleUserResponse {
  ConsoleUser user = 1;
  // Set only if generate_password was requested. Returned once.
  string generated_password = 2;
}

message UpdateConsoleUserRequest {
  string username = 1;
  // Empty keeps the current role.
  string role = 2;
  // Unset keeps the current state.
  optional bool disabled = 3;
}

message ResetConsoleUserPasswordRequest {
  string username = 1;
  string password = 2;
  bool generate_password = 3;
}

message ResetConsoleUserPasswordResponse {
  string generated_password = 1;
}

// RuntimeStorage contains connection settings and metadata, never credentials secrets.
message RuntimeStorage {
 string name = 1;
 string address = 2;
 string provider = 3;
 string default_region = 4;
 bool is_secure = 5;
 google.protobuf.Duration http_timeout = 6;
 google.protobuf.Duration health_check_interval = 7;
 RuntimeStorageRateLimit rate_limit = 8;
 string source = 9;
 bool is_main = 10;
 repeated RuntimeStorageUser users = 11;
 repeated string references = 12;
 google.protobuf.Timestamp created_at = 13;
 google.protobuf.Timestamp updated_at = 14;
 // Connection account of the storage (never the secret). configured=false: legacy per-user credentials only.
 ConnectionAccountInfo connection_account = 15;
 // Result of the last connection test (on save, on demand or the periodic re-check of steps 1-5).
 StorageTestResult last_test = 16;
 // Set when the storage was saved although the test had failing steps (force).
 string last_forced_save_by = 17;
 google.protobuf.Timestamp last_forced_save_at = 18;
 // True if the storage has no connection account: it only works with per-user credentials.
 bool legacy_credentials = 19;
 // Number of users with their own credentials on the storage. Always filled by ListRuntimeStorages.
 uint32 user_count = 20;
}
message RuntimeStorageRateLimit { bool enabled = 1; int32 rpm = 2; bool include_metadata_api = 3; }
message RuntimeStorageUser { string user = 1; string access_key_id = 2; string source = 3; }
message RuntimeStorageCredential { string user = 1; string access_key_id = 2; string secret_access_key = 3; }
// ListRuntimeStoragesRequest is wire-compatible with google.protobuf.Empty. Query: GET /tutti/storages?includeUsers=false.
message ListRuntimeStoragesRequest {
  // Default true (unset): each storage embeds its users. false: users is omitted and only user_count is set, which keeps
  // the call cheap with many users.
  optional bool include_users = 1;
}
message RuntimeStorageList { repeated RuntimeStorage storages = 1; string main_storage = 2; bool managed_storages_enabled = 3; }
message CreateRuntimeStorageRequest {
  RuntimeStorage storage = 1;
  // Per-user overrides (optional when connection_account is given).
  repeated RuntimeStorageCredential credentials = 2;
  // Save although the connection test has failing steps (recorded as last_forced_save_by/at).
  bool force = 3;
  ConnectionAccount connection_account = 4;
  StorageTestOptions test_options = 5;
}
message UpdateRuntimeStorageRequest {
  RuntimeStorage storage = 1;
  repeated RuntimeStorageCredential credentials = 2;
  bool confirm = 3;
  bool force = 4;
  // Unset keeps the current connection account. Use RotateStorageConnectionAccount to replace a working account.
  ConnectionAccount connection_account = 5;
  // Remove the connection account (back to legacy per-user credentials).
  bool clear_connection_account = 6;
  StorageTestOptions test_options = 7;
}
message RuntimeStorageName { string name = 1; }
message TestRuntimeStorageRequest { RuntimeStorage storage = 1; RuntimeStorageCredential credential = 2; }

// ConnectionAccount is the S3 account Tutti uses on a storage. The secret is only ever sent to the server.
message ConnectionAccount { string access_key_id = 1; string secret_access_key = 2; }
message ConnectionAccountInfo {
  bool configured = 1;
  string access_key_id = 2;
  // "config" (read-only, storages.<name>.connectionAccount) or "managed".
  string source = 3;
  // Set after a rotation: the previous key id, still usable on the storage until revoked.
  string previous_access_key_id = 4;
  google.protobuf.Timestamp rotated_at = 5;
  // Earlier than this the previous key must NOT be revoked on the storage: some proxies may not have polled the
  // new version yet (poll interval 2s + margin).
  google.protobuf.Timestamp safe_to_revoke_previous_after = 6;
}
message StorageTestFeatures { bool versioning = 1; bool tagging = 2; bool acl = 3; bool lifecycle = 4; bool policy = 5; }
message StorageTestOptions {
  // Prefix of the temporary probe bucket. Default "tutti-probe-". Use e.g. "app-tutti-probe-" when the account policy
  // is limited to a bucket prefix.
  string probe_bucket_prefix = 1;
  // Existing bucket to use instead of creating one (when bucket creation is not allowed). The bucket is not deleted.
  string probe_bucket = 2;
  // Features to check in steps 13/14. Unset: versioning if the provider supports it, no others.
  StorageTestFeatures features = 3;
  // Run the optional throughput check (step 17).
  bool throughput = 4;
}
message StorageTestStep {
  string id = 1;
  // Step number of the plan table (1-17).
  int32 number = 2;
  string name = 3;
  // "pass", "fail", "warn" or "skip".
  string status = 4;
  string call = 5;
  int64 latency_ms = 6;
  string message = 7;
  string missing_permission = 8;
  string hint = 9;
}
message StorageTestResult {
  google.protobuf.Timestamp tested_at = 1;
  // False if any step failed.
  bool ok = 2;
  bool has_warnings = 3;
  repeated StorageTestStep steps = 4;
  string probe_bucket = 5;
  // Probe buckets/objects that could not be removed.
  repeated string leftovers = 6;
  int64 duration_ms = 7;
  string access_key_id = 8;
  // "full" (all steps) or "periodic" (steps 1-5, run by the health checker).
  string kind = 9;
}
message TestStorageConnectionRequest {
  // Existing storage name. Alternatively give storage settings (and a connection_account) for an unsaved storage.
  string name = 1;
  RuntimeStorage storage = 2;
  // For an existing storage: test this account instead of the stored one (does not change the stored account).
  ConnectionAccount connection_account = 3;
  StorageTestOptions options = 4;
}
message RotateStorageConnectionAccountRequest {
  string name = 1;
  ConnectionAccount new_account = 2;
  StorageTestOptions options = 3;
  // Switch although the test has failing steps.
  bool force = 4;
}

message ProxySyncSettingsOverride {
  optional bool enabled = 1;
  optional int32 write_quorum = 2;
  google.protobuf.Duration timeout = 3;
  optional string on_quorum_failure = 4;
}

message ProxyReplicationSettingsOverride {
  optional string on_event_error = 1;
  google.protobuf.Duration event_retry_budget = 2;
  ProxySyncSettingsOverride sync = 3;
}

message ProxyHealthSettingsOverride {
  optional int32 failure_threshold = 1;
  google.protobuf.Duration open_duration = 2;
}

message ProxyFailoverSettingsOverride {
  optional bool enabled = 1;
  google.protobuf.Duration check_interval = 2;
  google.protobuf.Duration after = 3;
  optional int32 max_event_lag = 4;
}

message ProxySettingsOverride {
  ProxyReplicationSettingsOverride replication = 1;
  ProxyHealthSettingsOverride health = 2;
  ProxyFailoverSettingsOverride failover = 3;
  optional bool require_signed_content_type = 4;
  google.protobuf.Duration read_header_timeout = 5;
  google.protobuf.Duration writer_lease = 6;
  google.protobuf.Duration drain_delay = 7;
  google.protobuf.Duration ready_max_staleness = 8;
}

message ProxyFleetConfig {
  int64 version = 1;
  google.protobuf.Timestamp updated_at = 2;
  ProxySettingsOverride defaults = 3;
  map<string, ProxySettingsOverride> groups = 4;
}

message SetProxyFleetConfigRequest {
  ProxySettingsOverride defaults = 1;
  map<string, ProxySettingsOverride> groups = 2;
  // expected_version is the config version the caller loaded. When set and different from the stored version the
  // update is rejected with FailedPrecondition. Unset skips the check.
  optional int64 expected_version = 3;
}

message ListAuditLogRequest {
  string family = 1;
  string entity_key = 2;
  string actor = 3;
  string action = 4;
  google.protobuf.Timestamp since = 5;
  google.protobuf.Timestamp until = 6;
  int64 before_id = 7;
  int32 limit = 8;
}

message AuditLogEntry {
  int64 id = 1;
  google.protobuf.Timestamp occurred_at = 2;
  string actor = 3;
  string action = 4;
  string family = 5;
  string entity_key = 6;
  string before_json = 7;
  string after_json = 8;
  string request_id = 9;
}

message AuditLogList {
  repeated AuditLogEntry entries = 1;
  bool enabled = 2;
  string backend = 3;
}

message SystemFeaturesSettings {
  bool tagging = 1;
  bool acl = 2;
  bool lifecycle = 3;
  bool policy = 4;
  bool preserve_acl_grants = 5;
  bool versioning = 6;
}

message SystemWorkerSettings {
  optional int32 concurrency = 1;
  google.protobuf.Duration shutdown_timeout = 2;
  google.protobuf.Duration queue_update_interval = 3;
  google.protobuf.Duration task_check_interval = 4;
  google.protobuf.Duration delayed_task_check_interval = 5;
  google.protobuf.Duration swift_retry_interval = 6;
  google.protobuf.Duration pause_retry_interval = 7;
  google.protobuf.Duration switch_retry_interval = 8;
  optional int32 backlog_high_watermark = 9;
  optional int32 backlog_low_watermark = 10;
  optional int64 bandwidth_limit_bytes = 11;
  optional int64 buffer_budget_bytes = 12;
  // Share of concurrency given to bulk migration: 0 = default (20) or 5..95. Read at worker start only.
  optional int32 bulk_concurrency_percent = 13;
  // Parallel parts per multipart upload: 0 = default (1) or 1..16. Applied live to the next copy.
  optional int32 multipart_threads = 14;
  // Multipart part size in MiB: 0 = default (16) or 5..512. Applied live to the next copy.
  optional int32 multipart_part_size_mib = 15;
}

message SystemLockSettings {
  google.protobuf.Duration overlap = 1;
}

message SystemWebhookSettings {
  bool enabled = 1;
  string base_url = 2;
}

message SystemSettings {
  int64 version = 1;
  google.protobuf.Timestamp updated_at = 2;
  SystemFeaturesSettings features = 3;
  SystemWorkerSettings worker = 4;
  SystemLockSettings lock = 5;
  SystemWebhookSettings webhook = 6;
}

message UpdateSystemSettingsRequest {
  optional int64 expected_version = 1;
  SystemFeaturesSettings features = 2;
  SystemWorkerSettings worker = 3;
  SystemLockSettings lock = 4;
  SystemWebhookSettings webhook = 5;
}


message WorkerStatsSnapshot {
  string worker_id = 1;
  string started_at = 2;
  string updated_at = 3;
  int32 concurrency = 4;
  int32 bulk_concurrency = 5;
  int32 live_concurrency = 6;
  int64 in_flight = 7;
  int64 copied_objects_total = 8;
  int64 copied_bytes_total = 9;
  int64 failed_total = 10;
  double objects_per_sec_1m = 11;
  double bytes_per_sec_1m = 12;
  double objects_per_sec_5m = 13;
  double bytes_per_sec_5m = 14;
  double avg_copy_seconds_1m = 15;
  int64 buffer_total_bytes = 16;
  int64 buffer_used_bytes = 17;
  int64 buffer_waiters = 18;
  double buffer_wait_seconds_total = 19;
}

message WorkerStatsTotals {
  int64 in_flight = 1;
  int64 concurrency = 2;
  double objects_per_sec_1m = 3;
  double bytes_per_sec_1m = 4;
  double objects_per_sec_5m = 5;
  double bytes_per_sec_5m = 6;
  int64 buffer_total_bytes = 7;
  int64 buffer_used_bytes = 8;
  int64 buffer_waiters = 9;
  int64 copied_objects_total = 10;
  int64 copied_bytes_total = 11;
  int64 failed_total = 12;
}

message WorkerStatsResponse {
  repeated WorkerStatsSnapshot workers = 1;
  WorkerStatsTotals totals = 2;
}
