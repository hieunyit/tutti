type: google.api.Service
config_version: 3

http:
  rules:
    # Diff service:
    - selector: tutti.Diff.Start
      post: /diff/start
      body: "*"
    - selector: tutti.Diff.List
      get: /diff/list
    - selector: tutti.Diff.GetReport
      post: /diff/report
      body: "*"
    - selector: tutti.Diff.GetReportEntries
      post: /diff/report-entries
      body: "*"
    - selector: tutti.Diff.DeleteReport
      put: /diff/delete
      body: "*"
    - selector: tutti.Diff.Fix
      post: /diff/fix
      body: "*"
    - selector: tutti.Diff.Restart
      put: /diff/restart
      body: "*"
      # Tutti service:
    - selector: tutti.Tutti.GetAppVersion
      get: /version
    - selector: tutti.Tutti.GetStorages
      get: /storage
    - selector: tutti.Tutti.GetProxyCredentials
      get: /proxy
    - selector: tutti.Tutti.SetUserCredentials
      body: "*"
      post: /credentials
      # Policy service - replication:
    - selector: tutti.Policy.AvailableBuckets
      post: /replication/list-buckets
      body: "*"
    - selector: tutti.Policy.AddReplication
      post: /replication/add
      body: "*"
    - selector: tutti.Policy.GetReplication
      post: /replication/get
      body: "*"
    - selector: tutti.Policy.ListReplications
      post: /replication
      body: "*"
    - selector: tutti.Policy.PauseReplication
      put: /replication/pause
      body: "*"
    - selector: tutti.Policy.ResumeReplication
      put: /replication/resume
      body: "*"
    - selector: tutti.Policy.DeleteReplication
      put: /replication/delete
      body: "*"
    - selector: tutti.Policy.SwitchWithZeroDowntime
      post: /replication/switch/zero-downtime
      body: "*"
    - selector: tutti.Policy.SwitchWithDowntime
      post: /replication/switch
      body: "*"
    - selector: tutti.Policy.DeleteSwitch
      post: /replication/switch/delete
      body: "*"
    - selector: tutti.Policy.GetSwitchStatus
      post: /replication/switch/get
      body: "*"
      # Policy service - routing:
    - selector: tutti.Policy.ListRoutings
      post: /routing
      body: "*"
    - selector: tutti.Policy.AddRouting
      post: /routing/add
      body: "*"
    - selector: tutti.Policy.UpdateRouting
      put: /routing/update
      body: "*"
    - selector: tutti.Policy.DeleteRouting
      put: /routing/delete
      body: "*"
    - selector: tutti.Policy.BlockRouting
      put: /routing/block
      body: "*"
    - selector: tutti.Policy.UnblockRouting
      put: /routing/unblock
      body: "*"
    - selector: tutti.Policy.TestProxy
      post: /test-proxy
      body: "*"
      # Webhook service:
    - selector: tutti.Webhook.SwiftEvents
      post: "/webhook/{storage}/swift"
      body: "*"
    - selector: tutti.Webhook.S3Notifications
      post: "/webhook/{storage}/s3-notifications"
      body: "*"
      # Resilience service:
    - selector: tutti.Resilience.GetProxyStatus
      get: /tutti/proxies
    - selector: tutti.Resilience.GetStatsHistory
      get: /tutti/stats/history
    - selector: tutti.Resilience.GetWorkerStats
      get: /tutti/worker-stats
    - selector: tutti.Resilience.ListFailoverPolicies
      get: /tutti/failover/policies
    - selector: tutti.Resilience.SetFailoverPolicy
      post: /tutti/failover/policies
      body: "*"
    - selector: tutti.Resilience.DeleteFailoverPolicy
      put: /tutti/failover/policies/delete
      body: "*"
    - selector: tutti.Resilience.ListFailoverEvents
      get: /tutti/failover/events
    - selector: tutti.Resilience.DeleteFailoverEvent
      put: /tutti/failover/events/delete
      body: "*"
    - selector: tutti.Resilience.ListAccessPolicies
      get: /tutti/access-policies
    - selector: tutti.Resilience.SetAccessPolicy
      post: /tutti/access-policies
      body: "*"
    - selector: tutti.Resilience.DeleteAccessPolicy
      put: /tutti/access-policies/delete
      body: "*"
    - selector: tutti.Resilience.ListProxyAccounts
      get: /tutti/proxy-accounts
    - selector: tutti.Resilience.CreateProxyAccount
      post: /tutti/proxy-accounts
      body: "*"
    - selector: tutti.Resilience.RotateProxyAccountSecret
      put: /tutti/proxy-accounts/rotate
      body: "*"
    - selector: tutti.Resilience.SetProxyAccountStatus
      put: /tutti/proxy-accounts/status
      body: "*"
    - selector: tutti.Resilience.DeleteProxyAccount
      put: /tutti/proxy-accounts/delete
      body: "*"
    - selector: tutti.Resilience.ListS3Users
      get: /tutti/users
    - selector: tutti.Resilience.CreateS3User
      post: /tutti/users
      body: "*"
    - selector: tutti.Resilience.UpdateS3UserCredentials
      put: /tutti/users/credentials
      body: "*"
    - selector: tutti.Resilience.DeleteS3UserCredentials
      put: /tutti/users/credentials/delete
      body: "*"
    - selector: tutti.Resilience.DeleteS3User
      put: /tutti/users/delete
      body: "*"
    - selector: tutti.Resilience.TestS3UserCredentials
      post: /tutti/users/test
      body: "*"
    - selector: tutti.Resilience.ListConsoleUsers
      get: /tutti/console-users
    - selector: tutti.Resilience.CreateConsoleUser
      post: /tutti/console-users
      body: "*"
    - selector: tutti.Resilience.UpdateConsoleUser
      put: /tutti/console-users
      body: "*"
    - selector: tutti.Resilience.ResetConsoleUserPassword
      put: /tutti/console-users/password
      body: "*"
    - selector: tutti.Resilience.DeleteConsoleUser
      put: /tutti/console-users/delete
      body: "*"

    - selector: tutti.Resilience.ListRuntimeStorages
      get: /tutti/storages
    - selector: tutti.Resilience.CreateRuntimeStorage
      post: /tutti/storages
      body: "*"
    - selector: tutti.Resilience.UpdateRuntimeStorage
      put: /tutti/storages
      body: "*"
    - selector: tutti.Resilience.DeleteRuntimeStorage
      put: /tutti/storages/delete
      body: "*"
    - selector: tutti.Resilience.TestRuntimeStorage
      post: /tutti/storages/test-credential
      body: "*"
    - selector: tutti.Resilience.TestStorageConnection
      post: /tutti/storages/test
      body: "*"
    - selector: tutti.Resilience.RotateStorageConnectionAccount
      put: /tutti/storages/connection-account
      body: "*"
    - selector: tutti.Resilience.GetRuntimeStorage
      get: /tutti/storages/{name}
    - selector: tutti.ProtectionGroups.List
      get: /tutti/protection-groups
    - selector: tutti.ProtectionGroups.Get
      get: /tutti/protection-groups/{id}
    - selector: tutti.ProtectionGroups.Create
      post: /tutti/protection-groups
      body: "*"
    - selector: tutti.ProtectionGroups.Update
      put: /tutti/protection-groups
      body: "*"
    - selector: tutti.ProtectionGroups.Delete
      post: /tutti/protection-groups/delete
      body: "*"
    - selector: tutti.ProtectionGroups.Switchover
      post: /tutti/protection-groups/switchover
      body: "*"
    - selector: tutti.ProtectionGroups.AbortSwitch
      post: /tutti/protection-groups/abort-switch
      body: "*"
    - selector: tutti.ProtectionGroups.SetAutomaticFreeze
      put: /tutti/protection-groups/automatic-freeze
      body: "*"
    - selector: tutti.ProtectionGroups.GetAutomaticFreeze
      get: /tutti/protection-groups/automatic-freeze/status
    - selector: tutti.ProtectionGroups.ListWriters
      get: /tutti/protection-groups/{id}/writers
    - selector: tutti.ProtectionGroups.ClearWriter
      post: /tutti/protection-groups/clear-writer
      body: "*"
    - selector: tutti.ProtectionGroups.PlanFailoverMigration
      get: /tutti/failover/migration/plan
    - selector: tutti.ProtectionGroups.ApplyFailoverMigration
      post: /tutti/failover/migration/apply
      body: "*"
    - selector: tutti.ProtectionGroups.ListUnprotectedScopes
      get: /tutti/unprotected-scopes
    - selector: tutti.Resilience.GetProxyFleetConfig
      get: /tutti/proxy-config
    - selector: tutti.Resilience.SetProxyFleetConfig
      put: /tutti/proxy-config
      body: "*"
    - selector: tutti.Resilience.ListAuditLog
      get: /tutti/audit-log
    - selector: tutti.Resilience.GetSystemSettings
      get: /tutti/system-settings
    - selector: tutti.Resilience.UpdateSystemSettings
      put: /tutti/system-settings
      body: "*"

