type: google.api.Service
config_version: 3

http:
  rules:
    # Diff service:
    - selector: chorus.Diff.Start
      post: /diff/start
      body: "*"
    - selector: chorus.Diff.List
      get: /diff/list
    - selector: chorus.Diff.GetReport
      post: /diff/report
      body: "*"
    - selector: chorus.Diff.GetReportEntries
      post: /diff/report-entries
      body: "*"
    - selector: chorus.Diff.DeleteReport
      put: /diff/delete
      body: "*"
    - selector: chorus.Diff.Fix
      post: /diff/fix
      body: "*"
    - selector: chorus.Diff.Restart
      put: /diff/restart
      body: "*"
      # Chorus service:
    - selector: chorus.Chorus.GetAppVersion
      get: /version
    - selector: chorus.Chorus.GetStorages
      get: /storage
    - selector: chorus.Chorus.GetProxyCredentials
      get: /proxy
    - selector: chorus.Chorus.SetUserCredentials
      body: "*"
      post: /credentials
      # Policy service - replication:
    - selector: chorus.Policy.AvailableBuckets
      post: /replication/list-buckets
      body: "*"
    - selector: chorus.Policy.AddReplication
      post: /replication/add
      body: "*"
    - selector: chorus.Policy.GetReplication
      post: /replication/get
      body: "*"
    - selector: chorus.Policy.ListReplications
      post: /replication
      body: "*"
    - selector: chorus.Policy.PauseReplication
      put: /replication/pause
      body: "*"
    - selector: chorus.Policy.ResumeReplication
      put: /replication/resume
      body: "*"
    - selector: chorus.Policy.DeleteReplication
      put: /replication/delete
      body: "*"
    - selector: chorus.Policy.SwitchWithZeroDowntime
      post: /replication/switch/zero-downtime
      body: "*"
    - selector: chorus.Policy.SwitchWithDowntime
      post: /replication/switch
      body: "*"
    - selector: chorus.Policy.DeleteSwitch
      post: /replication/switch/delete
      body: "*"
    - selector: chorus.Policy.GetSwitchStatus
      post: /replication/switch/get
      body: "*"
      # Policy service - routing:
    - selector: chorus.Policy.ListRoutings
      post: /routing
      body: "*"
    - selector: chorus.Policy.AddRouting
      post: /routing/add
      body: "*"
    - selector: chorus.Policy.UpdateRouting
      put: /routing/update
      body: "*"
    - selector: chorus.Policy.DeleteRouting
      put: /routing/delete
      body: "*"
    - selector: chorus.Policy.BlockRouting
      put: /routing/block
      body: "*"
    - selector: chorus.Policy.UnblockRouting
      put: /routing/unblock
      body: "*"
    - selector: chorus.Policy.TestProxy
      post: /test-proxy
      body: "*"
      # Webhook service:
    - selector: chorus.Webhook.SwiftEvents
      post: "/webhook/{storage}/swift"
      body: "*"
    - selector: chorus.Webhook.S3Notifications
      post: "/webhook/{storage}/s3-notifications"
      body: "*"
      # Resilience service:
    - selector: chorus.Resilience.GetProxyStatus
      get: /tutti/proxies
    - selector: chorus.Resilience.GetStatsHistory
      get: /tutti/stats/history
    - selector: chorus.Resilience.ListFailoverPolicies
      get: /tutti/failover/policies
    - selector: chorus.Resilience.SetFailoverPolicy
      post: /tutti/failover/policies
      body: "*"
    - selector: chorus.Resilience.DeleteFailoverPolicy
      put: /tutti/failover/policies/delete
      body: "*"
    - selector: chorus.Resilience.ListFailoverEvents
      get: /tutti/failover/events
    - selector: chorus.Resilience.DeleteFailoverEvent
      put: /tutti/failover/events/delete
      body: "*"
    - selector: chorus.Resilience.ListAccessPolicies
      get: /tutti/access-policies
    - selector: chorus.Resilience.SetAccessPolicy
      post: /tutti/access-policies
      body: "*"
    - selector: chorus.Resilience.DeleteAccessPolicy
      put: /tutti/access-policies/delete
      body: "*"
    - selector: chorus.Resilience.ListProxyAccounts
      get: /tutti/proxy-accounts
    - selector: chorus.Resilience.CreateProxyAccount
      post: /tutti/proxy-accounts
      body: "*"
    - selector: chorus.Resilience.RotateProxyAccountSecret
      put: /tutti/proxy-accounts/rotate
      body: "*"
    - selector: chorus.Resilience.SetProxyAccountStatus
      put: /tutti/proxy-accounts/status
      body: "*"
    - selector: chorus.Resilience.DeleteProxyAccount
      put: /tutti/proxy-accounts/delete
      body: "*"
    - selector: chorus.Resilience.ListS3Users
      get: /tutti/users
    - selector: chorus.Resilience.CreateS3User
      post: /tutti/users
      body: "*"
    - selector: chorus.Resilience.UpdateS3UserCredentials
      put: /tutti/users/credentials
      body: "*"
    - selector: chorus.Resilience.DeleteS3User
      put: /tutti/users/delete
      body: "*"
    - selector: chorus.Resilience.TestS3UserCredentials
      post: /tutti/users/test
      body: "*"
    - selector: chorus.Resilience.ListConsoleUsers
      get: /tutti/console-users
    - selector: chorus.Resilience.CreateConsoleUser
      post: /tutti/console-users
      body: "*"
    - selector: chorus.Resilience.UpdateConsoleUser
      put: /tutti/console-users
      body: "*"
    - selector: chorus.Resilience.ResetConsoleUserPassword
      put: /tutti/console-users/password
      body: "*"
    - selector: chorus.Resilience.DeleteConsoleUser
      put: /tutti/console-users/delete
      body: "*"

    - selector: chorus.Resilience.ListRuntimeStorages
      get: /tutti/storages
    - selector: chorus.Resilience.CreateRuntimeStorage
      post: /tutti/storages
      body: "*"
    - selector: chorus.Resilience.UpdateRuntimeStorage
      put: /tutti/storages
      body: "*"
    - selector: chorus.Resilience.DeleteRuntimeStorage
      put: /tutti/storages/delete
      body: "*"
    - selector: chorus.Resilience.TestRuntimeStorage
      post: /tutti/storages/test-credential
      body: "*"
    - selector: chorus.Resilience.TestStorageConnection
      post: /tutti/storages/test
      body: "*"
    - selector: chorus.Resilience.RotateStorageConnectionAccount
      put: /tutti/storages/connection-account
      body: "*"
    - selector: chorus.Resilience.GetRuntimeStorage
      get: /tutti/storages/{name}
